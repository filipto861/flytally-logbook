name: TEMP D4 A2 frozen source-only reviewer package
on:
  push:
    branches:
      - docs/logbook-data1e3-d4-a2-audit-provenance-20261030
    paths:
      - .github/workflows/data1e3-d4-a2-review-temporary.yml
permissions:
  contents: read
jobs:
  source-only-review-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze executable source and check identity
        shell: bash
        run: |
          set -euo pipefail
          echo "A2_PACKAGING_HEAD=$(git rev-parse HEAD)"
          git cat-file -e 6fd5597aec03ee7b6cbab4dafd98228fafdaaea1^{commit}
          if [[ -n "$(git diff --name-only 6fd5597aec03ee7b6cbab4dafd98228fafdaaea1 HEAD -- lib app tooling tests AGENTS.md ARCHITECTURE.md DEVELOPMENT.md)" ]]; then
            echo "Executable or contract drift: STOP"
            exit 1
          fi
          echo "A2_FROZEN_SOURCE_MATCH=PASS"
      - name: Assemble exact-source archive and verify hashes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          frozen = "6fd5597aec03ee7b6cbab4dafd98228fafdaaea1"
          out = Path("dist/a2-review")
          sources = [
          "lib/account-restore-v6.ts",
          "lib/db-optimization.ts",
          "lib/account-backup.ts",
          "lib/portable-backup.ts",
          "lib/backup-authenticity.ts",
          "lib/db.ts",
          "lib/local-postgres.ts",
          "lib/data/flight-audit.ts",
          "lib/flight-audit.ts",
          "tooling/data1e3-d4-source-sql-risk-probe.mjs",
          "tests/integration/postgres-security-restore.test.ts",
          "AGENTS.md",
          "ARCHITECTURE.md",
          "DEVELOPMENT.md",
          ]
          design = [
          "docs/maintenance/2026-10-30-data1e3-d4-a2-audit-provenance-and-id-collision-design.md",
          "docs/maintenance/2026-10-30-data1e3-d4-a1-owner-pg16-two-session-pass-evidence.md",
          ]
          groups = [
          ("01_RESTORE_AND_AUDIT_SCHEMA.md", sources[0:2]),
          ("02_SIGNED_BACKUP_AND_TRUST.md", sources[2:5]),
          ("03_TRANSACTIONS_AND_AUDIT_CONSUMERS.md", sources[5:9]),
          ("04_ORIGINAL_SQL_REPRO_AND_PG_TEST.md", sources[9:11]),
          ("05_REPO_CONTRACTS.md", sources[11:]),
          ("06_A1_AND_A2_EVIDENCE_DESIGN.md", design),
          ]
          (out/"EXACT_SOURCE").mkdir(parents=True,exist_ok=True)
          (out/"VOLUMES").mkdir(parents=True,exist_ok=True)
          manifest = {"repository":"filipto861/flytally-logbook", "frozen_executable_sha":frozen,
                      "source_kind":"exact raw GitHub checkout of frozen executable SHA",
                      "only_executable_diff_from_frozen":[],
                      "files":[]}
          for p in sources+design:
              data=Path(p).read_bytes()
              dest=out/"EXACT_SOURCE"/p
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
              manifest["files"].append({"path":p,"archive_path":str(Path("EXACT_SOURCE")/p).replace(chr(92),"/"),
                                        "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          for name, paths in groups:
              lines=["# A2 reviewer source volume: "+name,
                     "Frozen executable source: "+frozen,
                     "Each source block is complete, with original 1-based line numbers. Exact unmodified bytes are also in EXACT_SOURCE.",
                     ""]
              for p in paths:
                  raw=Path(p).read_text(encoding="utf-8")
                  lines.append("## "+p)
                  lines.append("Source SHA256: "+hashlib.sha256(Path(p).read_bytes()).hexdigest())
                  lines.append("~~~text")
                  lines.extend(f"{i+1:5} | {line}" for i,line in enumerate(raw.splitlines()))
                  lines.extend(["~~~",""])
              (out/"VOLUMES"/name).write_text("\n".join(lines)+"\n",encoding="utf-8")
          prompt=Path("docs/maintenance/2026-10-30-data1e3-d4-a2-deepseek-review-prompt.md").read_bytes()
          (out/"00_DEEPSEEK_REVIEW_PROMPT.md").write_bytes(prompt)
          (out/"00_START_HERE.md").write_text(
              "# FlyTally D4 A2 read-only DeepSeek review pack\n\n"
              "Frozen executable source: "+frozen+"\n\n"
              "1. Paste 00_DEEPSEEK_REVIEW_PROMPT.md into DeepSeek.\n"
              "2. Upload all six VOLUMES/*.md (in batches if needed).\n"
              "3. EXACT_SOURCE contains original unmodified files; SOURCE_MANIFEST verifies SHA256.\n"
              "4. Do not ask reviewer to run commands, connect to databases, or implement.\n"
              "5. This pack is NOT a passed SQL/A2 security audit.\n",encoding="utf-8")
          (out/"01_SOURCE_MANIFEST.json").write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          for e in manifest["files"]:
              data=(out/e["archive_path"]).read_bytes()
              assert len(data)==e["bytes"] and hashlib.sha256(data).hexdigest()==e["sha256"]
          assert len(list((out/"VOLUMES").glob("*.md")))==6
          print("A2_REVIEW_PACKAGE_MANIFEST_PASS",len(manifest["files"]),"exact sources",len(groups),"volumes")
          PY
      - name: Publish read-only reviewer files
        uses: actions/upload-artifact@v4
        with:
          name: FlyTally-D4-A2-DeepSeek-Review
          path: dist/a2-review/
          if-no-files-found: error
          retention-days: 14
