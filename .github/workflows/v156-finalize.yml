name: v1.56.0 mobile responsive validation

on:
  push:
    branches:
      - codex/v1560-mobile-layout-audit

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: ${{ !contains(github.event.head_commit.message, 'v1.56.0 finalize mobile audit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1560-mobile-layout-audit
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set v1.56 release metadata
        run: npm version 1.56.0 --no-git-tag-version
      - name: Update roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('ROADMAP.md')
          text=path.read_text()
          heading='## v1.56.0 — Mobile Layout Audit & Responsive Hardening\n\n'
          if heading not in text:
              note=(heading
                    +'- Fix iOS/WebKit native date and time controls at the shared responsive layer instead of clipping page overflow.\n'
                    +'- Audit every primary navigation destination for intrinsic-width, grid, card, action and intentional-scroll behavior.\n'
                    +'- Keep forms and cards shrinkable with a reusable inline-size containment contract.\n'
                    +'- Preserve internal scrolling for wide tables and horizontal navigation strips.\n'
                    +'- Keep v1.51 regulatory semantics, certification, aircraft identity, GPS, print/export and backup/restore behavior unchanged.\n\n')
              marker='## v1.55.0 — Flight Entry Layout & Responsive UX'
              text=text.replace(marker,note+marker,1)
              path.write_text(text)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        run: npm run test:postgres
      - run: npm run build
      - name: Commit validated metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ROADMAP.md
          git commit -m "v1.56.0 finalize mobile audit"
          git push origin HEAD:codex/v1560-mobile-layout-audit
