name: v2.0 GA release cut updater

on:
  push:
    branches:
      - codex/v200-ga-release
    paths:
      - .github/workflows/v200-ga-release-cut.yml

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v200-ga-release
          fetch-depth: 0
      - name: Cut v2.0.0 metadata and documentation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path=Path("package.json")
          package=json.loads(package_path.read_text())
          assert package["version"]=="1.70.1", package["version"]
          package["version"]="2.0.0"
          package_path.write_text(json.dumps(package,indent=2)+"\n")

          lock_path=Path("package-lock.json")
          lock=lock_path.read_text()
          needle='"version": "1.70.1"'
          assert lock.count(needle)>=2, lock.count(needle)
          lock=lock.replace(needle,'"version": "2.0.0"',2)
          lock_path.write_text(lock)

          changelog_path=Path("CHANGELOG.md")
          changelog=changelog_path.read_text()
          marker="This file records production-facing behavior changes. Detailed regulatory rationale, migration evidence and UX audits remain in the version-specific review documents.\n\n"
          assert marker in changelog
          assert "## 2.0.0 — Multi-category Pilot Logbook" not in changelog
          release="""## 2.0.0 — Multi-category Pilot Logbook — 2026-09-07

### Added
- One canonical regulatory-category capability model for Aeroplane, Helicopter, Sailplane, Balloon, ULL and conservative Other records.
- Category-specific evidence and progressive disclosure inside the existing Add/Edit flight workflow rather than separate category-specific entry pages.
- Multi-category Flights presentation, filters, Statistics, Dashboard, Print/Export and pilot-context handling built on the same category contract.

### Regulatory integrity
- Historical TMG remains Part-FCL unless an explicit Sailplane / Part-SFCL snapshot exists; legacy GLIDER and BALLOON records remain conservatively resolvable without rewriting certified history.
- Part-FCL Aeroplane/Helicopter certification keeps the existing FCL.050 gate, while SFCL/BFCL records are no longer evaluated with aeroplane SP/MP, SE/ME or BLOCK-time assumptions.
- Sailplane/Balloon credited time uses AIR semantics where applicable; powered/ULL activity retains BLOCK semantics. Safety Pilot remains dashboard activity only and does not inflate regulatory pilot experience.
- Certification fingerprints, certified revisions, sharing, trash/restore and portable backup preserve category, launch and BFCL evidence.

### Hardening and release gate
- Conservative runtime migrations do not rewrite certified historical category evidence.
- RC acceptance covers historical accounts, certification, sharing, backup/restore and mixed-category PostgreSQL behavior.
- The release gate includes TypeScript, complete regression tests, PostgreSQL acceptance, retained 10k/50k scale evidence, production Next.js build and Vercel production verification.

"""
          changelog_path.write_text(changelog.replace(marker,marker+release,1))

          roadmap_path=Path("ROADMAP.md")
          roadmap=roadmap_path.read_text()
          old="## Current release — v1.62.0 — Sailplane / SPL / TMG support"
          assert old in roadmap
          new="""## Current release — v2.0.0 — Multi-category Pilot Logbook

- Use one canonical category/capability contract for `AEROPLANE`, `HELICOPTER`, `SAILPLANE`, `BALLOON`, `ULL` and conservative `OTHER` records.
- Keep one Add/Edit flight workflow while exposing category-appropriate evidence: Part-FCL PF movements, SFCL launch/TMG evidence and BFCL take-off/landing operation context.
- Keep historical TMG in Part-FCL unless Sailplane context is explicit and never rewrite certified category evidence during compatibility migrations.
- Apply coherent category-aware time semantics across Flights, Dashboard, Statistics, Print/Export and sharing while keeping auxiliary roles out of regulatory pilot-experience totals.
- Route certification by resolved regulatory family so Part-FCL keeps FCL.050 safeguards without applying aeroplane SP/MP, SE/ME or BLOCK-time assumptions to SFCL/BFCL records.
- Preserve category, launch and BFCL evidence through certification revisions, sharing, trash/restore and portable backup, with PostgreSQL plus 10k/50k release gates.

## v1.62.0 — Sailplane / SPL / TMG support"""
          roadmap_path.write_text(roadmap.replace(old,new,1))

          Path("tests/v200-release-metadata.test.ts").write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport path from "node:path";\nimport test from "node:test";\n\nconst root=path.resolve(import.meta.dirname,"..");\nconst read=(file:string)=>fs.readFileSync(path.join(root,file),"utf8");\n\ntest("v2.0 GA release metadata is aligned",()=>{\n  const pkg=JSON.parse(read("package.json")),lock=JSON.parse(read("package-lock.json"));\n  assert.equal(pkg.version,"2.0.0");\n  assert.equal(lock.version,"2.0.0");\n  assert.equal(lock.packages[""].version,"2.0.0");\n  assert.match(read("CHANGELOG.md"),/## 2\\.0\\.0 — Multi-category Pilot Logbook/);\n  assert.match(read("ROADMAP.md"),/## Current release — v2\\.0\\.0 — Multi-category Pilot Logbook/);\n});\n''')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md ROADMAP.md tests/v200-release-metadata.test.ts
          git rm .github/workflows/v200-ga-release-cut.yml
          git commit -m "v2.0.0 GA release cut"
          git push origin HEAD:codex/v200-ga-release
