name: DATA-1 quarantined PG16 acceptance (one-time)

on:
  push:
    branches: [chore/logbook-data1-pg-skip-acceptance-20261030]

permissions:
  contents: read

concurrency:
  group: data1-quarantined-pg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  currency_v21:
    name: currency_v21 exclusive ephemeral PG16 fixture
    if: github.repository == 'filipto861/flytally-logbook'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      DATABASE_URL: postgresql://flytally@127.0.0.1:55435/flytally_currency_test
      FLYTALLY_LOCAL_POSTGRES: "1"
      FLYTALLY_POSTGRES_INTEGRATION: "1"
      FLYTALLY_V21_RELEASE_DISPOSABLE: "1"
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Exact source checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned source dependencies
        run: npm ci --no-audit --no-fund
      - name: Create and verify independent empty PG16 localhost-only cluster
        shell: bash
        run: |
          set -euo pipefail
          bin=/usr/lib/postgresql/16/bin
          test -x "$bin/initdb"
          test -x "$bin/pg_ctl"
          sudo install -d -o postgres -g postgres -m 0700 /tmp/flytally-data1-pg-currency_v21
          sudo -u postgres "$bin/initdb" -D /tmp/flytally-data1-pg-currency_v21 -U flytally --auth-local=trust --auth-host=trust --no-instructions >/dev/null
          sudo -u postgres "$bin/pg_ctl" -D /tmp/flytally-data1-pg-currency_v21 -o "-h 127.0.0.1 -p 55435 -k /tmp" -l /tmp/flytally-data1-pg-currency_v21.log -w start
          "$bin/createdb" -h 127.0.0.1 -p 55435 -U flytally flytally_currency_test
          observed=$("$bin/psql" -d "$DATABASE_URL" -X -Atqc "SELECT current_database()||'|'||current_user||'|'||host(inet_server_addr())||'|'||inet_server_port()||'|'||(current_setting('server_version_num')::int BETWEEN 160000 AND 169999)::text||'|'||(SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public')")
          test "$observed" = "flytally_currency_test|flytally|127.0.0.1|55435|true|0"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run only quarantined currency_v21 source tests (NO SKIP accepted)
        shell: bash
        run: |
          set -euo pipefail
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/integration/postgres-currency-v21-release.test.ts | tee /tmp/data1-currency_v21-results.tap
          if grep -Eq '(^| )# SKIP|ℹ skipped [1-9]|# skipped [1-9]' /tmp/data1-currency_v21-results.tap; then
            echo "::error::Quarantined PG suite still skipped tests"
            exit 1
          fi
      - name: Stop and delete exclusive PG cluster
        if: always()
        shell: bash
        run: |
          if test -f /tmp/flytally-data1-pg-currency_v21/postmaster.pid; then
            sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D /tmp/flytally-data1-pg-currency_v21 -m immediate -w stop
          fi
          if test -d /tmp/flytally-data1-pg-currency_v21; then sudo rm -rf /tmp/flytally-data1-pg-currency_v21; fi
