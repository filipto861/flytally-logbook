name: DATA1E3 TEMP Windows Node24 non-DB targeted acceptance
on:
  push:
    branches:
      - fix/logbook-data1e3-v13-security-gates-20261030
    paths:
      - .github/workflows/data1e3-windows-non-db-temporary.yml
permissions:
  contents: read
jobs:
  targeted-node24-typecheck:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Fail closed if DB connection settings exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DATABASE_URL -or $env:POSTGRES_URL -or $env:NEON_DATABASE_URL -or $env:PGHOST -or $env:PGSERVICE -or $env:PGHOSTADDR) { throw 'Refuse any database connection environment' }
          if ((node --version) -notmatch '^v24\.') { throw 'Node.js 24 required' }
          Write-Host ('EXACT_TESTED_SHA=' + (git rev-parse HEAD))
          Write-Host ('NODE=' + (node --version))
          Write-Host 'NO DATABASE URL, NO POSTGRES, NO APP RESTORE, NO DEPLOY'
      - name: Install lockfile dependencies without lifecycle scripts
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
      - name: Scope classifier (read-only)
        shell: pwsh
        run: |
          npm run scope:changed -- 'app/(protected)/export/actions.ts' 'app/api/backups/[id]/route.ts' 'tests/v381-data1e3-stored-recovery-guards.test.ts'
          if ($LASTEXITCODE -ne 0) { throw "scope classifier failed" }
      - name: DATA-1E3 targeted synthetic HMAC and error response regression
        shell: pwsh
        run: |
          npm run test:target -- tests/v381-data1e3-stored-recovery-guards.test.ts
          if ($LASTEXITCODE -ne 0) { throw "targeted Node test failed" }
      - name: TypeScript non-DB typecheck
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "TypeScript typecheck failed" }
