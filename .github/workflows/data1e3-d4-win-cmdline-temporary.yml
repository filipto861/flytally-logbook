name: DATA1E3 TEMP Win24 PG command-line exact-path and sanitized diagnostic (NO DB)
on:
  push:
    branches:
      - test/logbook-data1e3-d4-one-local-pg16-20261030
    paths:
      - .github/workflows/data1e3-d4-win-cmdline-temporary.yml
permissions:
  contents: read
jobs:
  no-db-path:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Static syntax and SHA
        shell: pwsh
        run: |
          Write-Host ('TESTED_SHA=' + (git rev-parse HEAD))
          Write-Host ('NODE=' + (node --version))
          node --check tooling/data1e3-d4-win-process-path.mjs
          if ($LASTEXITCODE -ne 0) { throw 'helper syntax' }
          node --check tooling/data1e3-d4-owned-local-pg16.mjs
          if ($LASTEXITCODE -ne 0) { throw 'executor syntax' }
      - name: Path/host/fixture regression without any PostgreSQL
        shell: pwsh
        run: |
          node --test tooling/data1e3-d4-win-process-path.test.mjs tooling/data1e3-d4-pg-identity-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'source regression' }
      - name: No database
        shell: pwsh
        run: |
          Write-Host 'NO PG PROCESS NO SQL NO RESTORE NO DEPLOY'
