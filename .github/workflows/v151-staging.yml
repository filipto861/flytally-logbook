name: Assemble FlyTally v1.51 staging

on:
  push:
    branches:
      - codex/v151-regulatory-correctness

permissions:
  contents: write

concurrency:
  group: v151-staging
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded v1.51 transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/v151_apply.py')
          s=p.read_text()
          bad='replace_once(\'lib/recency-service.ts\',\'detail:"Landing-based 90-day planning indicator"\',\'detail:"FCL.060 · 3 take-offs, approaches and landings as PF"\')\n'
          if s.count(bad)!=1:
              raise SystemExit(f'expected one duplicate-label guard, found {s.count(bad)}')
          p.write_text(s.replace(bad,''))
          PY
          set -o pipefail
          python3 scripts/v151_apply.py 2>&1 | tee v151-transform.log
      - name: Align historical regression guards with the audited rule engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: expected one occurrence of {old!r}, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          # v1.35.5 intentionally hid movement evidence; v1.51 reintroduces it in one compact, optional PF card.
          patch('tests/v1355-recency-simplification.test.ts',
                'assert.doesNotMatch(form,/FCL[.]060 movement evidence|Day take-offs|Day approaches|Night take-offs|Night approaches/);',
                'assert.match(form,/pilot flying \\(PF\\)/i);assert.match(form,/Day take-offs/);assert.match(form,/Day approaches/);')
          # Mobile layout remains unchanged; only the authoritative engine underneath changed.
          patch('tests/v136-mobile-ux.test.ts','assert.match(service,/evaluatePassengerLandingIndicator/);','assert.match(service,/evaluatePassengerCurrencyMode/);')
          # v1.50 remains the historical UI-system release; v1.51 is now current.
          patch('tests/v150-ui-theme.test.ts','assert.match(roadmap,/Current release — v1\\.50\\.0 · UI system & theme convergence/);','assert.match(roadmap,/## v1\\.50\\.0 · UI system & theme convergence/);')
          # Keep the FCL.740 negative fixture genuinely one take-off short after the refresher flight contributes one movement.
          patch('tests/v151-regulatory-correctness.test.ts','minutes:660,landingsDay:12,takeoffsDay:11','minutes:660,landingsDay:12,takeoffsDay:10')
          # Never replace an explicitly stored zero movement count with the landing count when editing historical evidence.
          p=Path('components/flight-form.tsx'); s=p.read_text()
          for name, fallback in [('takeoffs_day','initialLandingsDay'),('takeoffs_night','initialLandingsNight'),('approaches_day','initialLandingsDay'),('approaches_night','initialLandingsNight')]:
              old=f'editing?Number(field("{name}"))||{fallback}:{fallback}'
              new=f'editing?(Number(field("{name}","0"))||0):{fallback}'
              if s.count(old)!=1: raise SystemExit(f'flight-form movement init guard failed for {name}: {s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Preserve transform diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v151-transform-diagnostics-${{ github.sha }}
          path: v151-transform.log
          retention-days: 7
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee v151-tests.log
      - name: Preserve regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v151-test-diagnostics-${{ github.sha }}
          path: v151-tests.log
          retention-days: 7
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        run: npm run test:postgres
      - run: npm run build
      - name: Commit clean staging source
        shell: bash
        run: |
          rm -f tsconfig.tsbuildinfo flytally-scale-evidence.json v151-transform.log v151-tests.log
          git rm scripts/v151_apply.py .github/workflows/v151-staging.yml
          git config user.name "filipto861"
          git config user.email "120219642+filipto861@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "v1.51.0 regulatory correctness core"
          git push origin HEAD:codex/v151-regulatory-correctness
