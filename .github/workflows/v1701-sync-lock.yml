name: Sync v1.70.1 lock metadata

on:
  push:
    branches:
      - codex/v1701-actionable-needs-attention

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1701-actionable-needs-attention
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Synchronize lockfile release metadata only
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --unified=0 -- package-lock.json > /tmp/lock.diff || true
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/lock.diff').read_text().splitlines()
          changed=[line for line in lines if line[:1] in '+-' and not line.startswith(('+++','---'))]
          expected=[
              '-  "version": "1.70.0",',
              '+  "version": "1.70.1",',
              '-      "version": "1.70.0",',
              '+      "version": "1.70.1",',
          ]
          if changed != expected:
              raise SystemExit(f'Unexpected package-lock changes: {changed!r}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(v1.70.1): sync lock metadata'
          git push origin HEAD:codex/v1701-actionable-needs-attention
