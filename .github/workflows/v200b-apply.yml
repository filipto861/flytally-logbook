name: Finalize v2.0-B category flight entry

on:
  push:
    branches:
      - codex/v200-category-flight-entry

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix reactive category dependency and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("components/flight-form.tsx")
          text=p.read_text()
          old='[editing,evidence,role,operationType,regulatoryCategory,movementTouched]'
          new='[editing,evidence,role,operationType,regulatoryCategory,aircraftClass,movementTouched]'
          if text.count(old)!=1:
              raise SystemExit(f"expected one dependency match, got {text.count(old)}")
          p.write_text(text.replace(old,new,1))
          Path(".github/workflows/v200b-apply.yml").unlink()
          PY
      - name: Commit final v2.0-B batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v2.0-B finalize category-aware flight entry"
          git push
