name: v1.55.0 flight entry layout

on:
  push:
    branches:
      - codex/v1550-flight-entry-layout

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'v1.55.0 apply flight entry layout') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1550-flight-entry-layout
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.55 flight-entry UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          form_path = Path('components/flight-form.tsx')
          text = form_path.read_text()
          start_marker = '    <section className="entry-section entry-section-primary">'
          end_marker = '    <details className="entry-section" open={pilotSectionOpen}>'
          start = text.index(start_marker)
          end = text.index(end_marker)
          replacement = '''    <section className="entry-section entry-section-primary"><p className="section-kicker">Flight essentials</p><div className="form-grid essential-grid">
      <label>Date<input name="date" type="date" value={date} onChange={event=>setDate(event.target.value)} required/></label>
      <label>Registration<select name="registration" value={registration} onChange={e=>pickAircraft(e.target.value)} required><option value="">Select</option>{registrationOptions.map(a=><option key={a.registration} value={a.registration}>{a.registration}{a.aircraft_type?` · ${a.aircraft_type}`:""}</option>)}</select><small><Link href="/database">Manage aircraft</Link></small></label>
      <label>Departure<input name="departure" value={departure} onChange={e=>setDeparture(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters"/></label>
      <label>Arrival<input name="arrival" value={arrival} onChange={e=>setArrival(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters"/></label>
      <label>Off-block <span className="field-hint">UTC</span><input name="offBlock" type="time" value={off} onChange={e=>setOff(e.target.value)}/></label>
      <label>On-block <span className="field-hint">UTC</span><input name="onBlock" type="time" value={on} onChange={e=>setOn(e.target.value)}/></label>
      <label>Takeoff <span className="field-hint">UTC</span><input name="takeoff" type="time" value={takeoff} onChange={e=>setTakeoff(e.target.value)}/></label>
      <label>Landing <span className="field-hint">UTC</span><input name="landing" type="time" value={landing} onChange={e=>setLanding(e.target.value)}/></label>
      <label>Role<select name="role" value={role} onChange={e=>setRole(e.target.value)} required><option value="">Select role</option>{ROLES.map(x=><option key={x} value={x}>{roleOptionLabel(x)}</option>)}</select>{roleGuidance?<small className="role-guidance">{roleGuidance}</small>:<small>Choose what you did on this flight. Most private flights are PIC.</small>}</label>
      <label>Day landings<input name="landingsDay" type="number" min="0" max="99" value={landingsDay} onChange={event=>changeDayLandings(Number(event.target.value)||0)}/></label>
    </div></section>
'''
          form_path.write_text(text[:start] + replacement + text[end:])

          css_path = Path('app/globals.css')
          css = css_path.read_text()
          marker = '/* FlyTally v1.55 — aligned flight essentials */'
          if marker not in css:
              css += '''\n\n/* FlyTally v1.55 — aligned flight essentials */\n.flight-form .essential-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;align-items:start}\n.flight-form .essential-grid>label{min-width:0;align-content:start;gap:7px}\n.flight-form .essential-grid>label>input,.flight-form .essential-grid>label>select{width:100%;min-width:0;height:48px;min-height:48px}\n.flight-form .essential-grid>label>small{line-height:1.35}\n@media(max-width:700px){.flight-form .essential-grid{grid-template-columns:1fr!important;gap:13px}.flight-form .essential-grid>label{width:100%;min-width:0}.flight-form .essential-grid>label>input,.flight-form .essential-grid>label>select{width:100%;min-width:0;height:48px;min-height:48px}}\n'''
          css_path.write_text(css)

          test_path = Path('tests/v155-flight-entry-layout.test.ts')
          test_path.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst form=fs.readFileSync("components/flight-form.tsx","utf8");\nconst css=fs.readFileSync("app/globals.css","utf8");\n\ntest("v1.55 flight essentials keep route and timeline fields paired",()=>{\n  const essentials=form.slice(form.indexOf('entry-section entry-section-primary'),form.indexOf('open={pilotSectionOpen}'));\n  const order=[\n    'name="date"','name="registration"',\n    'name="departure"','name="arrival"',\n    'name="offBlock"','name="onBlock"',\n    'name="takeoff"','name="landing"',\n    'name="role"','name="landingsDay"'\n  ].map(token=>essentials.indexOf(token));\n  assert.ok(order.every(index=>index>=0));\n  assert.deepEqual([...order].sort((a,b)=>a-b),order);\n});\n\ntest("v1.55 essentials are equal-width on desktop and single-column on mobile",()=>{\n  assert.match(css,/FlyTally v1\\.55 — aligned flight essentials/);\n  assert.match(css,/\\.flight-form \\.essential-grid\\{grid-template-columns:repeat\\(2,minmax\\(0,1fr\\)\\)/);\n  assert.match(css,/@media\\(max-width:700px\\)\\{\\.flight-form \\.essential-grid\\{grid-template-columns:1fr!important/);\n  assert.match(css,/height:48px;min-height:48px/);\n});\n''')

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text()
          note = '''\n## v1.55.0 — Flight Entry Layout & Responsive UX\n\n- Align Flight essentials into predictable two-column pairs on desktop.\n- Keep Departure/Arrival, Off-block/On-block and Takeoff/Landing on matching rows.\n- Use consistent control sizing and spacing.\n- Collapse to one logical single-column sequence on mobile without changing flight data semantics.\n\n'''
          if '## v1.55.0 — Flight Entry Layout & Responsive UX' not in roadmap:
              insert = roadmap.find('\n## ')
              roadmap = roadmap[:insert+1] + note + roadmap[insert+1:] if insert >= 0 else roadmap + note
              roadmap_path.write_text(roadmap)
          PY
          npm version 1.55.0 --no-git-tag-version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        run: npm run test:postgres
      - run: npm run build
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/flight-form.tsx app/globals.css tests/v155-flight-entry-layout.test.ts ROADMAP.md package.json package-lock.json
          git commit -m "v1.55.0 apply flight entry layout"
          git push origin HEAD:codex/v1550-flight-entry-layout
