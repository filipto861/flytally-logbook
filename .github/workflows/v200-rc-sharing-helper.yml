name: v2.0-RC sharing helper wiring
on:
  push:
    branches: [codex/v200-rc-multicategory-hardening]
    paths: [.github/workflows/v200-rc-sharing-helper.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v200-rc-multicategory-hardening
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/(protected)/flights/shared-actions.ts')
          s=p.read_text()
          old='import { refreshRecencySnapshot } from "@/lib/recency-service";import { resolveRegulatoryAircraftCategory } from "@/lib/aircraft-category";'
          new='import { refreshRecencySnapshot } from "@/lib/recency-service";import { sharedFlightCreditMinutes } from "@/lib/shared-flight-credit";'
          assert old in s
          s=s.replace(old,new,1)
          old2='const role=participantLogbookRole(participantRole),block=flightMinutes(text(row.off_block),text(row.on_block)),air=flightMinutes(text(row.takeoff),text(row.landing)),resolvedCategory=resolveRegulatoryAircraftCategory({regulatoryCategory:row.regulatory_category,aircraftClass:row.aircraft_class,evidence:row.evidence}),creditMinutes=["SAILPLANE","BALLOON"].includes(resolvedCategory)?(air||block):block,credit=crewRoleCredits(participantRole,creditMinutes)'
          new2='const role=participantLogbookRole(participantRole),creditMinutes=sharedFlightCreditMinutes(row),credit=crewRoleCredits(participantRole,creditMinutes)'
          assert old2 in s
          s=s.replace(old2,new2,1)
          # flightMinutes is no longer used in this action after extracting the helper.
          s=s.replace('import { flightMinutes } from "@/lib/dashboard-math";','')
          p.write_text(s)
          Path('.github/workflows/v200-rc-sharing-helper.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v2.0-RC use shared-flight credit helper"
          git push origin HEAD:codex/v200-rc-multicategory-hardening