name: Finalize FlyTally v1.59.2

on:
  push:
    branches:
      - codex/v1592-empty-defaults-aircraft-profile
    paths:
      - .github/workflows/v1592-finalize.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1592-empty-defaults-aircraft-profile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.59.2 changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v1592.py
          python /tmp/v1592.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        run: npm run test:postgres
      - run: npm run build
      - name: Commit validated v1.59.2 candidate
        shell: bash
        run: |
          rm -f flytally-postgres-acceptance.txt flytally-scale-evidence.json
          rm -f .github/workflows/v1592-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.59.2 — manual defaults and aircraft profile integrity"
          git push origin HEAD:codex/v1592-empty-defaults-aircraft-profile
