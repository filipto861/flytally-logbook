name: v1.53 metadata and copy sync

on:
  push:
    branches:
      - codex/v1530-everyday-ux

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, 'v1.53 sync generated metadata') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1530-everyday-ux
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Improve flight-entry copy and roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          form = Path('components/flight-form.tsx')
          text = form.read_text()
          needle = 'const roleLabel=(value:string)=>value==="INSTRUKTOR"?"INSTRUCTOR":value;\n'
          addition = '''const roleLabel=(value:string)=>value==="INSTRUKTOR"?"INSTRUCTOR":value;\nconst roleOptionLabel=(value:string)=>({PIC:"PIC — Pilot in command",SOLO:"SOLO — Supervised solo",DUAL:"DUAL — Training with instructor",SPIC:"SPIC — Student pilot in command",PICUS:"PICUS — PIC under supervision",INSTRUCTOR:"INSTRUCTOR — Giving instruction",EXAMINER:"EXAMINER — Flight examiner","SAFETY PILOT":"SAFETY PILOT","CO-PILOT":"CO-PILOT","CRUISE-RELIEF CO-PILOT":"CRUISE-RELIEF CO-PILOT",PAX:"PAX — Passenger",OBSERVER:"OBSERVER"} as Record<string,string>)[roleLabel(value)]||roleLabel(value);\n'''
          if 'const roleOptionLabel=' not in text:
              if needle not in text:
                  raise SystemExit('roleLabel anchor not found')
              text = text.replace(needle, addition, 1)
          old = '{registrationOptions.map(a=><option key={a.registration} value={a.registration}>{a.registration}</option>)}'
          new = '{registrationOptions.map(a=><option key={a.registration} value={a.registration}>{a.registration}{a.aircraft_type?` · ${a.aircraft_type}`:""}</option>)}'
          if old in text:
              text = text.replace(old, new, 1)
          old = '{ROLES.map(x=><option key={x} value={x}>{roleLabel(x)}</option>)}</select>{roleGuidance?<small className="role-guidance">{roleGuidance}</small>:null}'
          new = '{ROLES.map(x=><option key={x} value={x}>{roleOptionLabel(x)}</option>)}</select>{roleGuidance?<small className="role-guidance">{roleGuidance}</small>:<small>Choose what you did on this flight. Most private flights are PIC.</small>}'
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace('<summary><span>Aircraft & EASA record</span>', '<summary><span>Logbook details</span>', 1)
          form.write_text(text)

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text()
          if '## Current development — v1.53.0 · Guided everyday entry' not in text:
              anchor = '## Current release — v1.52.0 · Codebase Review & Cleanup\n'
              section = '''## Current development — v1.53.0 · Guided everyday entry\n\nFocus:\n- make normal manual entry the default New flight path while keeping GPS import one click away and directly addressable with `?mode=gps`\n- guide an empty account to add its first aircraft before presenting an unusable aircraft selector\n- reduce first-time aircraft creation to registration, type/model and normal logbook; reveal class only for EASA and keep pricing/technical defaults optional\n- simplify the full Aircraft profile with the same progressive-disclosure model so ordinary pilots do not need to understand every technical field before saving\n- make flight role choices self-explanatory while preserving the exact stored role codes and all certification/recency semantics\n- keep v1.51 regulatory rules, certification revisions/hashes, signatures, GPS evidence, ownership, print/export and backup/restore behavior unchanged\n\n'''
              if anchor not in text:
                  raise SystemExit('roadmap anchor not found')
              text = text.replace(anchor, section + anchor, 1)
              roadmap.write_text(text)
          PY
      - name: Synchronize package version
        run: npm version 1.53.0 --no-git-tag-version
      - name: Commit synchronized v1.53 files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/flight-form.tsx ROADMAP.md package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "v1.53 sync generated metadata and guided labels"
            git push origin HEAD:codex/v1530-everyday-ux
          fi
