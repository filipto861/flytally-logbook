name: Apply v2.0-C multi-category logbook UX

on:
  push:
    branches:
      - codex/v200-multicategory-logbook-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply category logbook batch
        run: python .github/v200c_apply.py
      - name: Commit category logbook batch
        run: |
          rm .github/v200c_apply.py
          rm .github/workflows/v200c-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v2.0-C — Multi-category Flights scope and logged time"
          git push origin HEAD:codex/v200-multicategory-logbook-ux
