name: v2.0-RC test anchor fixup
on:
  push:
    branches: [codex/v200-rc-multicategory-hardening]
    paths: [.github/workflows/v200-rc-test-anchor.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v200-rc-multicategory-hardening
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/v200-rc-multicategory-hardening.test.ts')
          s=p.read_text()
          old='assert.match(action,/to_jsonb\\(f\\).*flight_certified_revisions/s);'
          new='assert.match(action,/flight_certified_revisions.*to_jsonb\\(f\\)/s);'
          assert old in s
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/v200-rc-test-anchor.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v2.0-RC align certified revision source guard"
          git push origin HEAD:codex/v200-rc-multicategory-hardening