name: Apply FlyTally v1.58

on:
  push:
    branches:
      - codex/v1580-flight-entry-polish
    paths:
      - .github/workflows/v158-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1580-flight-entry-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.58 source and release record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path,old,new,count=1):
              p=Path(path); text=p.read_text(); found=text.count(old)
              if found < count: raise SystemExit(f"{path}: expected {count}, found {found}: {old[:120]!r}")
              p.write_text(text.replace(old,new,count))

          rep('package.json','"version": "1.57.0"','"version": "1.58.0"')
          rep('package-lock.json','"version": "1.57.0"','"version": "1.58.0"',2)
          rep('app/layout.tsx','import "./v157-flight-entry-workflow.css";','import "./v157-flight-entry-workflow.css";\nimport "./v158-flight-entry-polish.css";')

          # Remove recent-route query and prop entirely.
          rep('app/(protected)/flights/new/page.tsx','import { getManualEntryDefaults,getRecentRoutes } from "@/lib/data/flights";','import { getManualEntryDefaults } from "@/lib/data/flights";')
          rep('app/(protected)/flights/new/page.tsx','const [aircraft,defaults,instructorRows,recentRoutes]=await Promise.all([','const [aircraft,defaults,instructorRows]=await Promise.all([')
          rep('app/(protected)/flights/new/page.tsx',"    sql`SELECT DISTINCT u.display_name FROM pilot_connections c JOIN users u ON u.id=CASE WHEN c.requester_user_id=${userId} THEN c.recipient_user_id ELSE c.requester_user_id END WHERE c.status='accepted' AND ((c.requester_user_id=${userId} AND c.requester_label='instructor') OR (c.recipient_user_id=${userId} AND c.recipient_label='instructor')) ORDER BY u.display_name` as Promise<Array<Record<string,unknown>>>,\n    getRecentRoutes(userId),\n","    sql`SELECT DISTINCT u.display_name FROM pilot_connections c JOIN users u ON u.id=CASE WHEN c.requester_user_id=${userId} THEN c.recipient_user_id ELSE c.requester_user_id END WHERE c.status='accepted' AND ((c.requester_user_id=${userId} AND c.requester_label='instructor') OR (c.recipient_user_id=${userId} AND c.recipient_label='instructor')) ORDER BY u.display_name` as Promise<Array<Record<string,unknown>>>,\n")
          rep('app/(protected)/flights/new/page.tsx','manual={<FlightForm action={createFlight} aircraft={aircraft} initial={defaults} instructors={instructors} recentRoutes={recentRoutes}/>}','manual={<FlightForm action={createFlight} aircraft={aircraft} initial={defaults} instructors={instructors}/>}')

          # Current flight form no longer has a recent-routes API surface.
          rep('components/flight-form.tsx','type RecentRoute={departure:string;arrival:string};\n','')
          rep('components/flight-form.tsx','export function FlightForm({action,aircraft,initial={},instructors=[],recentRoutes=[]}:{action:Action;aircraft:AircraftOption[];initial?:Initial;instructors?:Array<{name:string}>;recentRoutes?:RecentRoute[]}){','export function FlightForm({action,aircraft,initial={},instructors=[]}:{action:Action;aircraft:AircraftOption[];initial?:Initial;instructors?:Array<{name:string}>}){')
          rep('components/flight-form.tsx','  const applyRoute=(from:string,to:string)=>{markDirty();setDeparture(from.toUpperCase());setArrival(to.toUpperCase())};\n','')

          # Explain safe aircraft-profile defaults without adding another visual block.
          rep('components/flight-form.tsx','<label>Registration<select name="registration" value={registration} onChange={e=>pickAircraft(e.target.value)} required><option value="">Select</option>{registrationOptions.map(a=><option key={a.registration} value={a.registration}>{a.registration}{a.aircraft_type?` · ${a.aircraft_type}`:""}</option>)}</select><small><Link href="/database">Manage aircraft</Link></small></label>','<label>Registration<select name="registration" value={registration} onChange={e=>pickAircraft(e.target.value)} required aria-invalid={!registration}><option value="">Select</option>{registrationOptions.map(a=><option key={a.registration} value={a.registration}>{a.registration}{a.aircraft_type?` · ${a.aircraft_type}`:""}</option>)}</select><small className={!registration?"field-message-error":undefined}>{!registration?"Required before save.":<>Aircraft profile applies type, logbook, class and billing defaults · <Link href="/database">Manage aircraft</Link></>}</small></label>')

          # Airport inputs: mobile-friendly, no autocorrect, no spelling substitutions.
          rep('components/flight-form.tsx','<label>Departure<input name="departure" value={departure} onChange={e=>setDeparture(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters"/></label>','<label>Departure<input name="departure" value={departure} onChange={e=>setDeparture(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters" autoComplete="off" autoCorrect="off" spellCheck={false}/></label>')
          rep('components/flight-form.tsx','<label>Arrival<input name="arrival" value={arrival} onChange={e=>setArrival(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters"/></label>','<label>Arrival<input name="arrival" value={arrival} onChange={e=>setArrival(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters" autoComplete="off" autoCorrect="off" spellCheck={false}/>{!editing&&departure&&arrival!==departure?<small><button className="field-inline-action" type="button" onClick={()=>{markDirty();setArrival(departure)}}>Use {departure} for local flight</button></small>:null}</label>')

          old='{!editing&&(departure||recentRoutes.length)?<div className="route-shortcuts wide" aria-label="Route shortcuts"><span>Quick route</span><div className="route-shortcuts-list">{departure?<button type="button" onClick={()=>applyRoute(departure,departure)} disabled={Boolean(arrival)&&arrival===departure}>Local · {departure} → {departure}</button>:null}{recentRoutes.slice(0,4).map(route=><button type="button" key={`${route.departure}-${route.arrival}`} onClick={()=>applyRoute(route.departure,route.arrival)}>{route.departure} → {route.arrival}</button>)}</div></div>:null}\n'
          rep('components/flight-form.tsx',old,'')

          # Inline missing-state guidance for already-required selectors only.
          rep('components/flight-form.tsx','<label>Role<select name="role" value={role} onChange={e=>setRole(e.target.value)} required><option value="">Select role</option>{ROLES.map(x=><option key={x} value={x}>{roleOptionLabel(x)}</option>)}</select>{roleGuidance?<small className="role-guidance">{roleGuidance}</small>:<small>Choose what you did on this flight. Most private flights are PIC.</small>}</label>','<label>Role<select name="role" value={role} onChange={e=>setRole(e.target.value)} required aria-invalid={!role}><option value="">Select role</option>{ROLES.map(x=><option key={x} value={x}>{roleOptionLabel(x)}</option>)}</select>{!role?<small className="field-message-error">Required before save.</small>:roleGuidance?<small className="role-guidance">{roleGuidance}</small>:<small>{selected&&role===profileRole?`Aircraft default: ${roleOptionLabel(role)}. Change it if this flight was different.`:"Choose what you did on this flight. Most private flights are PIC."}</small>}</label>')
          rep('components/flight-form.tsx','<label>Logbook<select name="evidence" value={evidence} onChange={e=>setEvidence(e.target.value)} required><option value="">Select logbook</option>{EVIDENCE.map(x=><option key={x}>{x}</option>)}</select></label>','<label>Logbook<select name="evidence" value={evidence} onChange={e=>setEvidence(e.target.value)} required aria-invalid={!evidence}><option value="">Select logbook</option>{EVIDENCE.map(x=><option key={x}>{x}</option>)}</select>{!evidence?<small className="field-message-error">Required before save.</small>:null}</label>')
          rep('components/flight-form.tsx','<label>Class<select name="aircraftClass" value={aircraftClass} onChange={e=>{setClass(e.target.value);if(e.target.value)setEngineType(defaultEngineType(e.target.value))}} required><option value="">Select class</option>{CLASSES.map(x=><option key={x}>{x}</option>)}</select></label>','<label>Class<select name="aircraftClass" value={aircraftClass} onChange={e=>{setClass(e.target.value);if(e.target.value)setEngineType(defaultEngineType(e.target.value))}} required aria-invalid={!aircraftClass}><option value="">Select class</option>{CLASSES.map(x=><option key={x}>{x}</option>)}</select>{!aircraftClass?<small className="field-message-error">Required before save.</small>:null}</label>')
          rep('components/flight-form.tsx','<label>Billing time<select name="billingBasis" value={billing} onChange={e=>setBilling(e.target.value as ""|"BLOCK"|"AIR")} required><option value="">Select billing</option>{BILLING.map(x=><option key={x}>{x}</option>)}</select></label>','<label>Billing time<select name="billingBasis" value={billing} onChange={e=>setBilling(e.target.value as ""|"BLOCK"|"AIR")} required aria-invalid={!billing}><option value="">Select billing</option>{BILLING.map(x=><option key={x}>{x}</option>)}</select>{!billing?<small className="field-message-error">Required before save.</small>:null}</label>')

          # New v1.58 UX layer; intentionally tiny and non-invasive.
          Path('app/v158-flight-entry-polish.css').write_text('''/* FlyTally v1.58 — flight-entry polish and transparent smart defaults. */\n.field-inline-action{appearance:none;border:0;background:transparent;padding:0;color:var(--accent2);font:inherit;font-weight:750;cursor:pointer;text-align:left}.field-inline-action:hover,.field-inline-action:focus-visible{text-decoration:underline}.field-message-error{color:#f59e0b!important;font-weight:750}.flight-form [aria-invalid="true"]{border-color:color-mix(in srgb,#f59e0b 68%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,#f59e0b 18%,transparent)}@media(max-width:700px){.field-inline-action{min-height:32px;display:inline-flex;align-items:center}}\n''')

          # v1.57 historical contract keeps its record but no longer freezes a superseded feature.
          p=Path('tests/v157-flight-entry-workflow.test.ts'); t=p.read_text()
          old='''test("v1.57 reuses recent routes and offers an explicit local-flight shortcut",()=>{\n  assert.match(page,/getManualEntryDefaults,getRecentRoutes/);\n  assert.match(page,/getRecentRoutes\\(userId\\)/);\n  assert.match(page,/recentRoutes=\\{recentRoutes\\}/);\n  assert.match(form,/Quick route/);\n  assert.match(form,/Local · \\{departure\\} → \\{departure\\}/);\n  assert.match(form,/recentRoutes\\.slice\\(0,4\\)/);\n  assert.match(form,/const applyRoute=/);\n});\n'''
          new='''test("v1.57 release record preserves the original route-shortcut rationale",()=>{\n  assert.match(changelog,/Recent-route shortcuts/);\n  assert.match(audit,/Route repetition/);\n  assert.match(audit,/local-flight shortcut/);\n});\n'''
          if old not in t: raise SystemExit('v157 route contract anchor missing')
          t=t.replace(old,new,1)
          t=t.replace('test("v1.57 keeps mobile source selection compact and route shortcuts locally scrollable",()=>{\n  assert.match(css,/@media\\(max-width:700px\\)/);\n  assert.match(css,/\\.entry-choice\\{grid-template-columns:repeat\\(2,minmax\\(0,1fr\\)\\)/);\n  assert.match(css,/\\.route-shortcuts-list\\{flex-wrap:nowrap;overflow-x:auto/);\n});','test("v1.57 keeps mobile source selection compact",()=>{\n  assert.match(css,/@media\\(max-width:700px\\)/);\n  assert.match(css,/\\.entry-choice\\{grid-template-columns:repeat\\(2,minmax\\(0,1fr\\)\\)/);\n});',1)
          p.write_text(t)

          Path('tests/v158-flight-entry-polish.test.ts').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst form=fs.readFileSync("components/flight-form.tsx","utf8");\nconst page=fs.readFileSync("app/(protected)/flights/new/page.tsx","utf8");\nconst css=fs.readFileSync("app/v158-flight-entry-polish.css","utf8");\nconst layout=fs.readFileSync("app/layout.tsx","utf8");\nconst pkg=JSON.parse(fs.readFileSync("package.json","utf8"));\nconst lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));\nconst changelog=fs.readFileSync("CHANGELOG.md","utf8");\nconst audit=fs.readFileSync("FLIGHT_ENTRY_UX_V158.md","utf8");\n\ntest("v1.58 metadata and final UX layer are synchronized",()=>{\n  assert.equal(pkg.version,"1.58.0");\n  assert.equal(lock.version,pkg.version);\n  assert.equal(lock.packages[""].version,pkg.version);\n  assert.ok(layout.indexOf("v158-flight-entry-polish.css")>layout.indexOf("v157-flight-entry-workflow.css"));\n  assert.match(changelog,/## 1\\.58\\.0 — Flight Entry Polish & Smart Defaults/);\n  assert.match(audit,/## Deliberately unchanged/);\n});\n\ntest("v1.58 removes Quick Routes from the current flight-entry surface",()=>{\n  assert.doesNotMatch(page,/getRecentRoutes/);\n  assert.doesNotMatch(page,/recentRoutes/);\n  assert.doesNotMatch(form,/Quick route/);\n  assert.doesNotMatch(form,/recentRoutes/);\n  assert.doesNotMatch(form,/route-shortcuts/);\n});\n\ntest("v1.58 keeps local flight as a small explicit action",()=>{\n  assert.match(form,/Use \\{departure\\} for local flight/);\n  assert.match(form,/setArrival\\(departure\\)/);\n  assert.match(form,/field-inline-action/);\n  assert.match(css,/\\.field-inline-action/);\n});\n\ntest("v1.58 makes existing smart defaults transparent instead of guessing regulatory data",()=>{\n  assert.match(form,/Aircraft profile applies type, logbook, class and billing defaults/);\n  assert.match(form,/Aircraft default:/);\n  assert.match(form,/shouldApplyAircraftProfileDefaults/);\n  assert.doesNotMatch(fs.readFileSync("lib/flight-input.ts","utf8"),/FlyTally v1\\.58/);\n});\n\ntest("v1.58 provides inline guidance only for fields that are already required",()=>{\n  for(const name of ["registration","role","evidence","aircraftClass","billingBasis"])assert.ok(form.includes(`aria-invalid={!${name==="aircraftClass"?"aircraftClass":name==="billingBasis"?"billing":name}}`));\n  assert.match(form,/field-message-error/);\n  assert.match(css,/\\[aria-invalid="true"\\]/);\n});\n\ntest("v1.58 airport entry disables mobile autocorrect and spelling substitution",()=>{\n  const matches=form.match(/autoCorrect="off" spellCheck=\\{false\\}/g)||[];\n  assert.equal(matches.length,2);\n});\n\ntest("v1.58 retains regulatory, aircraft-state and mobile safety nets",()=>{\n  for(const path of [\n    "tests/v151-regulatory-correctness.test.ts",\n    "tests/v1511-legacy-recency.test.ts",\n    "tests/v1512-recency-provenance.test.ts",\n    "tests/v1513-automatic-ull-credit.test.ts",\n    "tests/v1531-aircraft-state.test.ts",\n    "tests/v1543-aircraft-catalog.test.ts",\n    "tests/v155-flight-entry-layout.test.ts",\n    "tests/v156-mobile-layout-audit.test.ts",\n    "tests/v157-flight-entry-workflow.test.ts",\n  ])assert.equal(fs.existsSync(path),true,`${path} must remain`);\n});\n''')

          Path('FLIGHT_ENTRY_UX_V158.md').write_text('''# FlyTally v1.58.0 — Flight Entry Polish & Smart Defaults\n\n## Objective\n\nReduce visual noise in New flight and make FlyTally's existing safe defaults easier to understand. The release removes a v1.57 experiment that proved unnecessary in real use, keeps only the useful local-flight helper, and moves required-field guidance closer to the field that needs attention.\n\n## UX decisions\n\n1. **Quick Routes removed** — recent-route buttons duplicated information already easy to type and added a full visual row to the most important form. The recent-route database query remains available elsewhere but is no longer executed by New flight.\n2. **Local flight retained, but demoted** — a local flight is still common enough to justify one click. It now appears only as a small contextual action below Arrival after Departure is known.\n3. **Smart defaults are transparent** — FlyTally already derives aircraft type, normal logbook, class, billing/rate and initial role from the selected aircraft profile where safe. The form now explains that behavior rather than adding more automatic guesses.\n4. **Required guidance is local** — Registration, Role, Logbook, Class and Billing already had required semantics. Missing-state guidance now appears directly at those controls as well as in Review. No new field became mandatory.\n5. **Airport typing is mobile-safe** — Departure and Arrival disable autocorrect and spellcheck so iOS/Android keyboards do not rewrite ICAO/location identifiers.\n\n## Smart-default boundary\n\nFlyTally may prefill values owned by the aircraft profile or obvious mechanical defaults. It must not infer flight-specific or regulatory facts merely for convenience. In particular, v1.58 does not newly infer pilot role, PF evidence, instructor/supervisor identity, countersignature evidence, movement counts or Part-FCL qualification/class from unrelated data.\n\n## Deliberately unchanged\n\n- `parseFlightInput()` and stored flight semantics;\n- FCL.050/FCL.060, LAPL and FCL.740.A calculations;\n- eligible ULL credit rules;\n- movement/PF evidence and countersignature rules;\n- certification fingerprints, revisions and signatures;\n- aircraft-state integrity introduced in v1.53.1;\n- GPS import/evidence, sharing, print/export and backup/restore.\n\n## Verification contract\n\nRelease requires TypeScript, the full regression suite, PostgreSQL acceptance, Next.js production build, a clean Vercel preview, squash merge, production CI, production deployment smoke and runtime error/fatal audit.\n''')

          # Changelog: append a new durable release record above v1.57.
          p=Path('CHANGELOG.md'); c=p.read_text(); anchor='## 1.57.0 — Flight Entry Workflow Simplification — 2026-09-01\n'
          section='''## 1.58.0 — Flight Entry Polish & Smart Defaults — 2026-09-01\n\n### Removed\n- Quick Routes from New flight, including the unnecessary recent-route query on that page.\n\n### Changed\n- Local flight is now a small contextual `Use DEP for local flight` action below Arrival rather than a separate route-shortcut block.\n- Aircraft-profile defaults are explained next to Registration and the initial role, so automatic values are visible rather than surprising.\n- Existing required selectors show inline missing-state guidance in addition to the final Review summary.\n- Departure and Arrival disable mobile autocorrect/spellcheck for cleaner airport-code entry.\n\n### Preserved\n- No new regulatory inference and no change to flight parsing/storage, recency, movements, certification, aircraft identity, GPS evidence, sharing, export or backup semantics.\n\n### Verification\n- Release gate: TypeScript + complete regression suite + PostgreSQL acceptance + production build + clean Vercel preview + production CI/runtime audit.\n- Detailed record: `FLIGHT_ENTRY_UX_V158.md`.\n\n'''
          if anchor not in c: raise SystemExit('changelog v1.57 anchor missing')
          p.write_text(c.replace(anchor,section+anchor,1))

          p=Path('ROADMAP.md'); r=p.read_text(); anchor='## v1.57.0 — Flight Entry Workflow Simplification\n'
          section='''## v1.58.0 — Flight Entry Polish & Smart Defaults\n\n- Remove Quick Routes from New flight and keep only a compact explicit local-flight helper.\n- Make existing aircraft-profile defaults understandable without adding regulatory guesses.\n- Move missing-state guidance next to selectors that are already required.\n- Harden airport-code typing on mobile and keep the v1.57 live BLOCK/AIR + inline Review workflow.\n- Preserve v1.51 regulatory semantics, v1.53.1 aircraft-state integrity and v1.56 responsive containment.\n\n'''
          if anchor not in r: raise SystemExit('roadmap v1.57 anchor missing')
          p.write_text(r.replace(anchor,section+anchor,1))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        run: npm run test:postgres
      - run: npm run build
      - name: Commit clean validated v1.58 tree
        shell: bash
        run: |
          rm -f flytally-postgres-acceptance.txt flytally-scale-evidence.json tsconfig.tsbuildinfo
          rm -f .github/workflows/v158-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.58.0 flight entry polish and smart defaults"
          git push origin HEAD:codex/v1580-flight-entry-polish
