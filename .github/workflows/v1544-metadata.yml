name: v1.54.4 release metadata

on:
  push:
    branches:
      - codex/v1544-picker-close

permissions:
  contents: write

jobs:
  metadata:
    if: ${{ !contains(github.event.head_commit.message, 'v1.54.4 set release metadata') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1544-picker-close
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm version 1.54.4 --no-git-tag-version
      - name: Commit metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "v1.54.4 set release metadata"
          git push origin HEAD:codex/v1544-picker-close
