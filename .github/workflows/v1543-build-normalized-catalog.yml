name: v1.54.3 build normalized aircraft catalogue

on:
  push:
    branches:
      - codex/v1543-aircraft-catalog

permissions:
  contents: write

jobs:
  build-catalog:
    if: ${{ !contains(github.event.head_commit.message, 'v1.54.3 build normalized aircraft catalogue') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1543-aircraft-catalog
          persist-credentials: true
      - name: Build FlyTally aircraft type catalogue
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/flytally-catalog
          mkdir -p /tmp/flytally-catalog/full /tmp/flytally-catalog/types data
          curl -fsSL https://raw.githubusercontent.com/Mictronics/aircraft-database/main/aircraft_db.zip -o /tmp/flytally-catalog/full.zip
          curl -fsSL https://raw.githubusercontent.com/Mictronics/aircraft-database/main/icao_aircraft_types.zip -o /tmp/flytally-catalog/types.zip
          unzip -q /tmp/flytally-catalog/full.zip -d /tmp/flytally-catalog/full
          unzip -q /tmp/flytally-catalog/types.zip -d /tmp/flytally-catalog/types
          python - <<'PY'
          import collections,json,pathlib,re
          full=pathlib.Path('/tmp/flytally-catalog/full')
          type_file=next(pathlib.Path('/tmp/flytally-catalog/types').rglob('*.json'))
          type_meta=json.loads(type_file.read_text())
          names=collections.defaultdict(collections.Counter)
          for path in full.rglob('*.json'):
              try: obj=json.loads(path.read_text(errors='replace'))
              except Exception: continue
              if not isinstance(obj,dict): continue
              for value in obj.values():
                  if not isinstance(value,dict): continue
                  code=str(value.get('t') or '').strip().upper()
                  desc=' '.join(str(value.get('desc') or '').split())
                  if code and desc: names[code][desc]+=1
          multi=[
            'De Havilland Canada','British Aerospace','BAE Systems','General Dynamics','Lockheed Martin',
            'Czech Sport Aircraft','BRM Aero','Flight Design','JMB Aircraft',"Van's Aircraft",'Vans Aircraft',
            'Aero Vodochody','Pipistrel Aircraft','Diamond Aircraft','Cirrus Aircraft','Piper Aircraft',
            'Cessna Aircraft','Textron Aviation','Bombardier Aerospace','Gulfstream Aerospace','Dassault Aviation',
            'Pilatus Aircraft','Robin Aircraft','Extra Aircraft','American Champion','North American',
            'New Piper','Socata Daher','Daher Socata','Pacific Aerospace','Vulcanair Aircraft'
          ]
          def split_identity(desc):
              if not desc:return ('','')
              low=desc.lower()
              for prefix in sorted(multi,key=len,reverse=True):
                  if low.startswith(prefix.lower()+' '):
                      return (desc[:len(prefix)],desc[len(prefix):].strip())
              parts=desc.split(' ',1)
              return (parts[0],parts[1] if len(parts)>1 else desc)
          def class_hint(d):
              d=(d or '').upper()
              if d.startswith('L1P'): return 'SEP'
              if d.startswith('L2P'): return 'MEP'
              if d.startswith('L1T'): return 'SET'
              return ''
          entries=[]
          for code in sorted(set(type_meta)|set(names)):
              choices=names.get(code)
              best=''
              observations=0
              if choices:
                  best,observations=sorted(choices.items(),key=lambda item:(-item[1],-len(item[0]),item[0]))[0]
              make,model=split_identity(best)
              meta=type_meta.get(code) if isinstance(type_meta.get(code),dict) else {}
              entries.append({
                'icao':code,
                'label':best or code,
                'make':make,
                'model':model or best or code,
                'descriptor':str(meta.get('desc') or ''),
                'wtc':str(meta.get('wtc') or ''),
                'classHint':class_hint(meta.get('desc')),
                'observations':observations
              })
          entries.sort(key=lambda e:(e['label'].casefold(),e['icao']))
          pathlib.Path('data/aircraft-type-catalog.json').write_text(json.dumps(entries,separators=(',',':'),ensure_ascii=False)+'\n')
          stats={
            'entries':len(entries),
            'named':sum(bool(e['make']) for e in entries),
            'sepHints':sum(e['classHint']=='SEP' for e in entries),
            'mepHints':sum(e['classHint']=='MEP' for e in entries),
            'setHints':sum(e['classHint']=='SET' for e in entries)
          }
          pathlib.Path('data/aircraft-type-catalog-stats.json').write_text(json.dumps(stats,indent=2)+'\n')
          PY
          UPSTREAM_SHA=$(git ls-remote https://github.com/Mictronics/aircraft-database.git refs/heads/main | cut -f1)
          cat > data/AIRCRAFT_TYPES_SOURCE.md <<EOF
          # Aircraft type catalogue source

          FlyTally's bundled aircraft-type catalogue is derived from **Mictronics/aircraft-database**.

          - Upstream: https://github.com/Mictronics/aircraft-database
          - Source exports: \`aircraft_db.zip\` and \`icao_aircraft_types.zip\`
          - License: **Open Data Commons Attribution License (ODC-By)**
          - Upstream states that exports are updated once per week.
          - Imported upstream commit: \`${UPSTREAM_SHA}\`
          - Imported: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          FlyTally uses the catalogue only as an identity/search aid. Manufacturer/model strings are derived from the most frequently observed non-empty description for each ICAO type in the upstream export and remain editable by the pilot.

          ICAO aircraft descriptors (for example \`L1P\`) are **not** Part-FCL aircraft classes. FlyTally may display a non-binding class hint for common landplane combinations, but the pilot must confirm the Part-FCL class separately. No class hint is certification evidence.

          Aircraft absent from the catalogue can always be entered manually.
          EOF
          rm -f data/aircraft-types-mictronics.json data/MICRONICS_SCHEMA_SAMPLE.json
      - name: Commit normalized catalogue
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aircraft-type-catalog.json data/aircraft-type-catalog-stats.json data/AIRCRAFT_TYPES_SOURCE.md
          git add -u data
          git commit -m "v1.54.3 build normalized aircraft catalogue"
          git push origin HEAD:codex/v1543-aircraft-catalog
