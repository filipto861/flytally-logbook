name: Browser smoke

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "app/**"
      - "components/**"
      - "public/**"
      - "e2e/**"
      - "lib/**"
      - "tooling/bootstrap-browser-smoke-db.mjs"
      - "playwright.config.mjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-smoke.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium desktop + mobile
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_browser"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_browser
      FLYTALLY_LOCAL_POSTGRES: "1"
      FLYTALLY_AUTH_BROWSER: "1"
      FLYTALLY_BROWSER_PASSWORD: FlyTally-Browser-2026!
      SESSION_SECRET: flytally-browser-session-secret-not-production
      SIGNING_SECRET: flytally-browser-signing-secret-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Bootstrap isolated browser database
        run: node tooling/bootstrap-browser-smoke-db.mjs
      - name: Production build
        run: npm run build
      - name: Real browser smoke
        run: npx playwright test --config=playwright.config.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flytally-browser-smoke-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
