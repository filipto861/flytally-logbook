name: v1.54.3 import aircraft type catalogue

on:
  push:
    branches:
      - codex/v1543-aircraft-catalog

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, 'v1.54.3 import Mictronics aircraft types') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1543-aircraft-catalog
          persist-credentials: true
      - name: Download open aircraft type catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/flytally-aircraft-catalog data
          curl -fsSL https://raw.githubusercontent.com/Mictronics/aircraft-database/main/icao_aircraft_types.zip -o /tmp/flytally-aircraft-catalog/types.zip
          unzip -o /tmp/flytally-aircraft-catalog/types.zip -d /tmp/flytally-aircraft-catalog/unpacked
          SOURCE=$(find /tmp/flytally-aircraft-catalog/unpacked -type f -name '*.json' | head -n1)
          test -n "$SOURCE"
          cp "$SOURCE" data/aircraft-types-mictronics.json
          cat > data/AIRCRAFT_TYPES_SOURCE.md <<'EOF'
          # Aircraft type catalogue source

          FlyTally bundles an aircraft-type reference derived from the Mictronics aircraft-database project.

          Source: `Mictronics/aircraft-database` → `icao_aircraft_types.zip`
          License: Open Data Commons Attribution License (ODC-By)
          Upstream: https://github.com/Mictronics/aircraft-database

          The upstream repository states that exports are updated once per week. FlyTally treats this catalogue as an aircraft identity aid only. ICAO type designators do **not** determine Part-FCL class (SEP/TMG/MEP/SET/etc.); class remains a separate user-confirmed logbook field.

          Manual aircraft entry remains supported for types absent from the catalogue.
          EOF
          printf '\nImported source SHA: %s\n' "$(git ls-remote https://github.com/Mictronics/aircraft-database.git refs/heads/main | cut -f1)" >> data/AIRCRAFT_TYPES_SOURCE.md
          printf 'Imported UTC: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> data/AIRCRAFT_TYPES_SOURCE.md
      - name: Commit imported catalogue
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aircraft-types-mictronics.json data/AIRCRAFT_TYPES_SOURCE.md
          git commit -m "v1.54.3 import Mictronics aircraft types"
          git push origin HEAD:codex/v1543-aircraft-catalog
