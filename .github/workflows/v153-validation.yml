name: v1.53 full validation

on:
  push:
    branches:
      - codex/v1530-everyday-ux

permissions:
  contents: read

concurrency:
  group: v153-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependency graph
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit and regression tests
        run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        shell: bash
        run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tee flytally-v153-postgres.txt
      - name: Preserve PostgreSQL acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flytally-v153-postgres-${{ github.sha }}
          path: flytally-v153-postgres.txt
          retention-days: 90
      - name: Production build
        run: npx next build
