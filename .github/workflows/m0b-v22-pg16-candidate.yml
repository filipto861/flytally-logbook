name: V22 candidate disposable PostgreSQL 16 acceptance

on:
  push:
    branches:
      - feat/logbook-m0b-v22-expand-candidate-20261104

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_m0b_disposable_ci
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_m0b_disposable_ci"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact branch Node 24 source tests
        run: |
          set -euo pipefail
          node --version
          node --check tooling/sql/m0b-v22-expand-candidate.test.mjs
          node --test tooling/sql/m0b-v22-expand-candidate.test.mjs
      - name: Install locked app dependencies for runtime boundary checks
        run: npm ci
      - name: New owner/cron boundary tests and legacy privacy contract
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/v22-trash-owner-boundary.test.ts tests/v280-privacy-self-service.test.ts
      - name: TypeScript / Next source check
        run: npm run typecheck
      - name: Full Node unit and source regression
        run: npm test
      - name: Production build diagnostic (not deployment)
        run: npm run build
      - name: Source-only V22 transactional candidate and canonical V21 emitter tests
        run: |
          set -euo pipefail
          node --check tooling/m0b-v22-canonical-v21-fixture.mjs
          node --test tooling/sql/m0b-v22-trash-lifecycle.test.mjs
          node tooling/m0b-v22-canonical-v21-fixture.mjs > /tmp/m0b-v21-source-exact.sql
          test "$(wc -c < /tmp/m0b-v21-source-exact.sql)" -gt 20000
      - name: Run source-exact 21 migrations and owner-gated V22 lifecycle on isolated PG16
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$PG_CONTAINER" =~ ^[a-f0-9]{64}$ ]] || { echo 'No owned PG service'; exit 1; }
          [[ "$(docker inspect --format '{{.Config.Image}}' "$PG_CONTAINER")" == 'postgres:16' ]] || exit 1
          pgdb() {
            local db="$1"; shift
            docker exec -i -e PGPASSWORD=flytally "$PG_CONTAINER" psql -h 127.0.0.1 \
              -U flytally -d "$db" -X -v ON_ERROR_STOP=1 -A -t -q "$@"
          }
          printf 'CREATE DATABASE flytally_m0b_disposable_full_v21;\n' | pgdb postgres
          target="$(printf "SELECT current_database()||'|'||current_user||'|'||host(inet_server_addr())||'|'||current_setting('server_version_num');\n" | pgdb flytally_m0b_disposable_full_v21)"
          [[ "$target" =~ ^flytally_m0b_disposable_full_v21\|flytally\|127\.0\.0\.1\|16[0-9]{4}$ ]] || {
            echo "REFUSED full V21 test target <$target>"; exit 1;
          }
          pgdb flytally_m0b_disposable_full_v21 < /tmp/m0b-v21-source-exact.sql
          pgdb flytally_m0b_disposable_full_v21 < tooling/sql/m0b-v22-expand-candidate.sql
          pgdb flytally_m0b_disposable_full_v21 < tooling/sql/m0b-v22-trash-lifecycle-candidate.sql
          pgdb flytally_m0b_disposable_full_v21 < tooling/sql/m0b-v22-trash-lifecycle-acceptance.sql
          if pgdb postgres < tooling/sql/m0b-v22-trash-lifecycle-candidate.sql >/dev/null 2>/tmp/m0b-v22-wrong-target.txt; then
            echo 'FAIL: candidate allowed wrong database'; exit 1
          fi
          grep -Fq 'isolated loopback PG16 flytally target' /tmp/m0b-v22-wrong-target.txt
          if pgdb flytally_m0b_disposable_full_v21 < tooling/sql/m0b-v22-trash-lifecycle-candidate.sql >/dev/null 2>/tmp/m0b-v22-rerun.txt; then
            echo 'FAIL: candidate overwritten existing function'; exit 1
          fi
          grep -Fq 'already exists; review required' /tmp/m0b-v22-rerun.txt
          printf 'CREATE ROLE m0b_v22_read_only NOLOGIN;\nGRANT USAGE ON SCHEMA public TO m0b_v22_read_only;\n' | pgdb flytally_m0b_disposable_full_v21
          if printf 'SET ROLE m0b_v22_read_only; SELECT public.logbook_v22_expire_owner_candidate(9001,25);\n' |
            pgdb flytally_m0b_disposable_full_v21 >/dev/null 2>/tmp/m0b-v22-role.txt; then
            echo 'FAIL: PUBLIC EXECUTE unexpectedly allowed'; exit 1
          fi
          grep -Fq 'permission denied for function logbook_v22_expire_owner_candidate' /tmp/m0b-v22-role.txt
          # Two independent PostgreSQL backends prove gate ordering, not a
          # mocked transaction. Only on the freshly built disposable V21 DB.
          printf "INSERT INTO public.users(id,email) VALUES(9013,'synthetic-lock@example.test');\n" |
            pgdb flytally_m0b_disposable_full_v21
          docker exec -i -e PGPASSWORD=flytally -e PGAPPNAME=m0b_v22_holder "$PG_CONTAINER" \
            psql -h 127.0.0.1 -U flytally -d flytally_m0b_disposable_full_v21 \
              -X -v ON_ERROR_STOP=1 -A -t -q -c \
              'BEGIN; SELECT id FROM public.users WHERE id=9013 FOR UPDATE; SELECT pg_sleep(3); COMMIT;' \
            >/tmp/m0b-v22-holder.log 2>&1 &
          holder_pid=$!
          holder_ready=0
          for i in $(seq 1 25); do
            active="$(printf "SELECT count(*) FROM pg_stat_activity WHERE application_name='m0b_v22_holder' AND wait_event='PgSleep';\n" |
              pgdb flytally_m0b_disposable_full_v21)"
            if [[ "$active" == 1 ]]; then holder_ready=1; break; fi
            sleep 0.1
          done
          [[ "$holder_ready" == 1 ]] || { echo 'FAIL: first backend never held account gate'; exit 1; }
          docker exec -i -e PGPASSWORD=flytally -e PGAPPNAME=m0b_v22_waiter "$PG_CONTAINER" \
            psql -h 127.0.0.1 -U flytally -d flytally_m0b_disposable_full_v21 \
              -X -v ON_ERROR_STOP=1 -A -t -q -c \
              'SELECT public.logbook_v22_expire_owner_candidate(9013,25);' \
            >/tmp/m0b-v22-waiter.log 2>&1 &
          waiter_pid=$!
          observed_lock=0
          for i in $(seq 1 25); do
            waiting="$(printf "SELECT count(*) FROM pg_stat_activity WHERE application_name='m0b_v22_waiter' AND wait_event_type='Lock';\n" |
              pgdb flytally_m0b_disposable_full_v21)"
            if [[ "$waiting" == 1 ]]; then observed_lock=1; break; fi
            sleep 0.1
          done
          wait "$holder_pid"
          wait "$waiter_pid"
          [[ "$observed_lock" == 1 ]] || { echo 'FAIL: second backend did not block on first owner gate'; exit 1; }
          grep -Fxq '0' /tmp/m0b-v22-waiter.log || {
            echo 'FAIL: second backend did not resume and return zero'; exit 1;
          }
          echo 'PASS: two distinct PG16 backends serialize same-owner expiry on first user gate.'
          echo 'PASS: exact V1-V21 source migrations + V22 SQL owner lifecycle, rollback, deny-by-role.'
      - name: Derive complete browser-feature V21 fixture without destructive reset
        run: |
          set -euo pipefail
          node --check tooling/m0b-v22-feature-v21-fixture.mjs
          node tooling/m0b-v22-feature-v21-fixture.mjs > /tmp/m0b-v21-app-features.sql
          test "$(wc -c < /tmp/m0b-v21-app-features.sql)" -gt 20000
          if grep -Eiq '\bDROP\s+(SCHEMA|DATABASE|TABLE)\b' /tmp/m0b-v21-app-features.sql; then
            echo 'FAIL: source feature fixture emits destructive DDL'; exit 1
          fi
      - name: V21 application feature catalog and immutable terminal lineage on disposable PG16
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$PG_CONTAINER" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$(docker inspect --format '{{.Config.Image}}' "$PG_CONTAINER")" == "postgres:16" ]] || exit 1
          pgdb() {
            local db="$1"; shift
            docker exec -i -e PGPASSWORD=flytally "$PG_CONTAINER" psql -h 127.0.0.1 \
              -U flytally -d "$db" -X -v ON_ERROR_STOP=1 -A -t -q "$@"
          }
          printf 'CREATE DATABASE flytally_m0b_disposable_feature_v21;\n' | pgdb postgres
          identity="$(printf "SELECT current_database()||'|'||current_user||'|'||host(inet_server_addr())||'|'||current_setting('server_version_num');\n" | pgdb flytally_m0b_disposable_feature_v21)"
          [[ "$identity" =~ ^flytally_m0b_disposable_feature_v21\|flytally\|127\.0\.0\.1\|16[0-9]{4}$ ]] || {
            echo "Refused feature fixture target <$identity>"; exit 1;
          }
          pgdb flytally_m0b_disposable_feature_v21 < /tmp/m0b-v21-app-features.sql
          pgdb flytally_m0b_disposable_feature_v21 < tooling/sql/m0b-v22-expand-candidate.sql
          pgdb flytally_m0b_disposable_feature_v21 < tooling/sql/m0b-v22-trash-lifecycle-candidate.sql
          pgdb flytally_m0b_disposable_feature_v21 < tooling/sql/m0b-v22-feature-v21-acceptance.sql
          pgdb flytally_m0b_disposable_feature_v21 < tooling/sql/m0b-v22-source-writers-acceptance.sql
          echo 'PASS: current application V21 feature snapshot and independent immutable terminal lineage on isolated PG16.'
      - name: Execute unchanged candidate on single disposable local PG16
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$PG_CONTAINER" =~ ^[a-f0-9]{64}$ ]] || { echo "Refused: service identity missing"; exit 1; }
          [[ "$(docker inspect --format '{{.Config.Image}}' "$PG_CONTAINER")" == "postgres:16" ]] || { echo "Refused: service image mismatch"; exit 1; }
          pg() {
            docker exec -i -e PGPASSWORD=flytally "$PG_CONTAINER" psql \
              -h 127.0.0.1 -U flytally -d flytally_m0b_disposable_ci \
              -X -v ON_ERROR_STOP=1 -A -t -q "$@"
          }
          identity="$(printf "SELECT current_database()||'|'||current_user||'|'||host(inet_server_addr())||'|'||current_setting('server_version_num');\n" | pg)"
          echo "Disposable PostgreSQL identity: <$identity>"
          [[ "$identity" =~ ^flytally_m0b_disposable_ci\|flytally\|127\.0\.0\.1\|16[0-9]{4}$ ]] || { echo "Refused: SQL connection identity mismatch"; exit 1; }
          cat <<'SQL' | pg
          CREATE TABLE public.users (id BIGINT PRIMARY KEY);
          CREATE TABLE public.flights (
            id BIGINT PRIMARY KEY, user_id BIGINT NOT NULL REFERENCES public.users(id));
          CREATE TABLE public.fstd_sessions (
            id BIGINT PRIMARY KEY, user_id BIGINT NOT NULL REFERENCES public.users(id));
          CREATE TABLE public.deleted_flights (
            id BIGINT PRIMARY KEY, user_id BIGINT NOT NULL REFERENCES public.users(id),
            purge_after TIMESTAMPTZ, restored_at TIMESTAMPTZ, restored_flight_id BIGINT);
          INSERT INTO public.users(id) VALUES(100),(200);
          INSERT INTO public.flights(id,user_id) VALUES(1,100),(2,100),(3,200);
          INSERT INTO public.fstd_sessions(id,user_id) VALUES(101,100),(102,100);
          INSERT INTO public.deleted_flights(id,user_id,purge_after,restored_at,restored_flight_id)
            VALUES(10,100,now()+'1 day',now(),1),(11,100,now()+'1 day',now(),1);
          SQL
          pg < tooling/sql/m0b-v22-expand-candidate.sql
          assertion="$(cat <<'SQL' | pg
          SELECT
            (SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND column_name='event_uid' AND table_name IN ('flights','fstd_sessions','deleted_flights'))||'|'||
            (SELECT count(*) FROM public.flights WHERE event_uid IS NULL)||'|'||
            (SELECT count(*) FROM public.fstd_sessions WHERE event_uid IS NULL)||'|'||
            (SELECT count(*) FROM public.deleted_flights WHERE event_uid IS NULL)||'|'||
            (SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('idx_flights_owner_event_uid','idx_fstd_owner_event_uid','idx_deleted_flights_owner_event_uid'));
          SQL
          )"
          [[ "$assertion" == "3|3|2|2|3" ]] || { echo "Legacy/catalog acceptance FAIL: $assertion"; exit 1; }
          cat <<'SQL' | pg
          UPDATE public.flights SET event_uid='00000000-0000-4000-8000-000000000001' WHERE id IN(1,3);
          UPDATE public.fstd_sessions SET event_uid='00000000-0000-4000-8000-000000000002' WHERE id=101;
          UPDATE public.deleted_flights SET event_uid='00000000-0000-4000-8000-000000000001' WHERE id IN(10,11);
          INSERT INTO public.logbook_event_uid_registry(owner_id,event_kind,event_uid,lifecycle_state)
            VALUES(100,'flight','00000000-0000-4000-8000-000000000001','active');
          INSERT INTO public.logbook_event_uid_registry(
            owner_id,event_kind,event_uid,lifecycle_state,original_trash_cutoff,marker_until)
            VALUES(100,'flight','00000000-0000-4000-8000-000000000003','purged',now(),now()+'1 day');
          SQL
          assert="$(cat <<'SQL' | pg
          SELECT (SELECT count(*) FROM public.deleted_flights WHERE event_uid='00000000-0000-4000-8000-000000000001')||'|'||
                 (SELECT count(*) FROM public.flights WHERE event_uid='00000000-0000-4000-8000-000000000001')||'|'||
                 (SELECT count(*) FROM public.logbook_event_uid_registry);
          SQL
          )"
          [[ "$assert" == "2|2|2" ]] || { echo "Owner/history compatibility FAIL: $assert"; exit 1; }
          expect_failure() {
            local needle="$1" command="$2"
            if printf '%s\n' "$command" | pg >/dev/null 2>/tmp/v22-error.txt; then
              echo "Expected SQL rejection did not occur"; exit 1
            fi
            grep -Fq "$needle" /tmp/v22-error.txt || {
              echo "Unexpected rejection class"; cat /tmp/v22-error.txt; exit 1;
            }
          }
          expect_failure 'idx_flights_owner_event_uid' \
            "UPDATE public.flights SET event_uid='00000000-0000-4000-8000-000000000001' WHERE id=2;"
          expect_failure 'idx_fstd_owner_event_uid' \
            "UPDATE public.fstd_sessions SET event_uid='00000000-0000-4000-8000-000000000002' WHERE id=102;"
          expect_failure 'logbook_uid_registry_marker_shape' \
            "INSERT INTO public.logbook_event_uid_registry(owner_id,event_kind,event_uid,lifecycle_state) VALUES(100,'flight','00000000-0000-4000-8000-000000000004','purged');"
          expect_failure 'logbook_uid_registry_marker_shape' \
            "INSERT INTO public.logbook_event_uid_registry(owner_id,event_kind,event_uid,lifecycle_state,marker_until) VALUES(100,'flight','00000000-0000-4000-8000-000000000005','active',now());"
          if pg < tooling/sql/m0b-v22-expand-candidate.sql >/dev/null 2>/tmp/v22-rerun-error.txt; then
            echo 'Unexpected SQL candidate rerun success'; exit 1
          fi
          grep -Fq 'target already contains UID objects' /tmp/v22-rerun-error.txt
          [[ "$(printf "SELECT count(*) FROM public.logbook_event_uid_registry;\n" | pg)" == "2" ]] || exit 1
          echo "PASS: PG16 disposable exact-candidate DDL, legacy, owner uniqueness, restored archives, marker checks, idempotence refusal."
      - name: Reject wrong target and prove atomic DDL rollback after second ALTER
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$PG_CONTAINER" =~ ^[a-f0-9]{64}$ ]] || { echo "Refused: no isolated service"; exit 1; }
          [[ "$(docker inspect --format '{{.Config.Image}}' "$PG_CONTAINER")" == "postgres:16" ]] || exit 1
          pgdb() {
            local db="$1"; shift
            docker exec -i -e PGPASSWORD=flytally "$PG_CONTAINER" psql \
              -h 127.0.0.1 -U flytally -d "$db" -X -v ON_ERROR_STOP=1 -A -t -q "$@"
          }
          if pgdb postgres < tooling/sql/m0b-v22-expand-candidate.sql >/dev/null 2>/tmp/v22-wrong-target.txt; then
            echo "FAIL: wrong database accepted"; exit 1
          fi
          grep -Fq 'requires owned local disposable loopback target' /tmp/v22-wrong-target.txt
          printf 'CREATE DATABASE flytally_m0b_disposable_rollback;\n' | pgdb postgres
          cat <<'SQL' | pgdb flytally_m0b_disposable_rollback
          CREATE TABLE public.users (id BIGINT PRIMARY KEY);
          CREATE TABLE public.flights (id BIGINT PRIMARY KEY,user_id BIGINT NOT NULL);
          CREATE TABLE public.fstd_sessions (id BIGINT PRIMARY KEY,user_id BIGINT NOT NULL);
          CREATE TABLE public.deleted_flights (
            id BIGINT PRIMARY KEY,user_id BIGINT NOT NULL,
            purge_after TIMESTAMPTZ,restored_at TIMESTAMPTZ,restored_flight_id BIGINT);
          CREATE FUNCTION public.v22_test_abort_second_alter() RETURNS event_trigger AS $abort$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='fstd_sessions' AND column_name='event_uid') THEN
              RAISE EXCEPTION 'V22 intentional test-only forced failure after second ALTER';
            END IF;
          END
          $abort$ LANGUAGE plpgsql;
          CREATE EVENT TRIGGER v22_test_abort ON ddl_command_end
            WHEN TAG IN ('ALTER TABLE') EXECUTE FUNCTION public.v22_test_abort_second_alter();
          SQL
          if pgdb flytally_m0b_disposable_rollback \
              < tooling/sql/m0b-v22-expand-candidate.sql >/dev/null 2>/tmp/v22-forced-rollback.txt; then
            echo "FAIL: synthetic mid-transaction DDL error did not stop candidate"; exit 1
          fi
          grep -Fq 'V22 intentional test-only forced failure after second ALTER' /tmp/v22-forced-rollback.txt
          result="$(cat <<'SQL' | pgdb flytally_m0b_disposable_rollback
          SELECT (SELECT COUNT(*) FROM information_schema.columns
            WHERE table_schema='public' AND table_name IN ('flights','fstd_sessions','deleted_flights')
            AND column_name='event_uid')||'|'||
            (to_regclass('public.logbook_event_uid_registry') IS NULL)::text;
          SQL
          )"
          [[ "$result" == "0|true" ]] || { echo "FAIL: DDL rollback incomplete $result"; exit 1; }
          echo 'PASS: wrong database refused; forced second-ALTER error rolls back all previous candidate DDL.'
