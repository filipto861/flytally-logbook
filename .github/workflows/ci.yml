name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Also run the authenticated Playwright browser tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disposable local test database. Port 55441 and the fixed database name are
  # required by the schema-first v21 test guards (see tooling/run-auth-browser.mjs).
  DATABASE_URL: postgresql://flytally@127.0.0.1:55441/flytally_currency_test
  SIGNING_SECRET: ci-signing-secret-not-for-production-0123456789
  SESSION_SECRET: ci-session-secret-not-for-production-0123456789

jobs:
  app:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_DB: flytally_currency_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55441:5432
        options: >-
          --health-cmd="pg_isready -U flytally"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:postgres:full

  browser:
    name: Browser (Playwright)
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_DB: flytally_currency_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55441:5432
        options: >-
          --health-cmd="pg_isready -U flytally"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      FLYTALLY_BROWSER_PASSWORD: FlyTally-Browser-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
