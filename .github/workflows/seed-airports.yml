name: Seed airport database

on:
  workflow_dispatch:
  push:
    paths:
      - "data/airports.csv"
      - "data/logbook.sqlite"
      - "scripts/seed_airports_full.py"
      - ".github/workflows/seed-airports.yml"

permissions:
  contents: write

jobs:
  seed-airports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import full airport database into SQLite
        run: python scripts/seed_airports_full.py

      - name: Commit updated SQLite database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/logbook.sqlite
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Persist full airport database"
            git push
          fi
