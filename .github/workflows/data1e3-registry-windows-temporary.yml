name: DATA1E3 TEMP recovery registry and PG16 preflight-plan non-DB QA
on:
  push:
    branches:
      - fix/logbook-data1e3-v13-security-gates-20261030
    paths:
      - .github/workflows/data1e3-registry-windows-temporary.yml
permissions:
  contents: read
jobs:
  non-db-registry-contract:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Identity and fail closed on database connection environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node --version) -notmatch '^v24\.') { throw 'Requires Node 24' }
          $forbidden = @('DATABASE_URL','POSTGRES_URL','NEON_DATABASE_URL','PGHOST','PGHOSTADDR','PGSERVICE','VERCEL','VERCEL_ENV')
          foreach($name in $forbidden) { if ([Environment]::GetEnvironmentVariable($name)) { throw "Forbidden runtime environment: $name" } }
          Write-Host ('TESTED_SHA=' + (git rev-parse HEAD))
          Write-Host ('NODE=' + (node --version))
          Write-Host 'NON-DB ONLY: no PostgreSQL / HTTP restore / deployment'
      - name: Install exact lockfile without scripts
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Registry integrity and previous source HMAC regressions
        shell: pwsh
        run: |
          npm run test:target -- tests/development-scope.test.ts tests/development-pipeline.test.ts tests/v381-data1e3-stored-recovery-guards.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'targeted regression failed' }
      - name: Exact recovery source group contract
        shell: pwsh
        run: |
          npm run test:group -- data-recovery-contract
          if ($LASTEXITCODE -ne 0) { throw 'recovery group failed' }
      - name: Ownership and selected risks must remain conservative
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = npm run scope:changed -- 'tests/v381-data1e3-stored-recovery-guards.test.ts' 'app/(protected)/export/actions.ts' 'app/api/backups/[id]/route.ts'
          if ($LASTEXITCODE -ne 0) { throw 'scope classifier failed' }
          $text = $result -join "`n"
          Write-Host $text
          if ($text -match 'unowned-test') { throw 'Recovery regression is still unowned' }
          foreach ($required in @('data-recovery-contract','postgres=true','browser=true','full_tests=true','build=true')) {
            if (-not $text.Contains($required)) { throw "Missing required coverage: $required" }
          }
      - name: TypeScript non-DB typecheck
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'typecheck failed' }
