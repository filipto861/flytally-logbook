name: Verify FlyTally web

on:
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run the complete unit/regression suite instead of the targeted UI suite
        required: true
        type: boolean
        default: true
      postgres:
        description: Run PostgreSQL acceptance
        required: true
        type: boolean
        default: false
      scale:
        description: Use the full PostgreSQL scale gate when PostgreSQL acceptance is enabled
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Manual application diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Targeted UI regression tests
        if: inputs.full_tests != true
        run: npm run test:group -- ui-contract
      - name: Full unit and regression tests
        if: inputs.full_tests == true
        run: npm test

  postgres:
    name: Manual PostgreSQL diagnostic
    if: inputs.postgres == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: PostgreSQL acceptance tests
        env:
          SCALE_GATE: ${{ inputs.scale }}
        shell: bash
        run: |
          set -o pipefail
          if [[ "$SCALE_GATE" == "true" ]]; then
            npm run test:postgres:full 2>&1 | tee flytally-postgres-acceptance.txt
          else
            npm run test:postgres 2>&1 | tee flytally-postgres-acceptance.txt
          fi
      - name: Preserve PostgreSQL acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flytally-postgres-acceptance-${{ github.sha }}
          path: flytally-postgres-acceptance.txt
          retention-days: 14
      - name: Preserve scale evidence
        if: always() && inputs.scale == true
        uses: actions/upload-artifact@v4
        with:
          name: flytally-scale-evidence-${{ github.sha }}
          path: |
            flytally-scale-evidence.json
            flytally-v169-scale-evidence.json
            flytally-v230-100k-scale-evidence.json
          if-no-files-found: warn
          retention-days: 90
