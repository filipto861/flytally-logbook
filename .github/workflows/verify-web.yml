name: Verify FlyTally web

on:
  pull_request:
  push:
    branches:
      - codex/vercel-migration-v080

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/flytally
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
