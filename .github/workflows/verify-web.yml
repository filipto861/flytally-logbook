name: Verify FlyTally web

on:
  pull_request:
    branches:
      - main
      - codex/vercel-migration-v080
  push:
    branches:
      - codex/vercel-migration-v080

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/vercel-migration-v080'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        shell: bash
        run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tee flytally-postgres-acceptance.txt
      - name: Preserve PostgreSQL acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flytally-postgres-acceptance-${{ github.sha }}
          path: flytally-postgres-acceptance.txt
          retention-days: 90
      - name: Preserve scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flytally-scale-evidence-${{ github.sha }}
          path: flytally-scale-evidence.json
          if-no-files-found: warn
          retention-days: 90
      - run: npm run build
