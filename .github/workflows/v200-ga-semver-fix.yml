name: v2.0 GA semver regression fix
on:
  push:
    branches: [codex/v200-ga-release]
    paths: [.github/workflows/v200-ga-semver-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v200-ga-release
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/v162-sailplane-spl.test.ts')
          s=p.read_text()
          old='assert.ok(/^1\\.(?:6[2-9]|[7-9]\\d|\\d{3,})\\./.test(pkg.version));assert.equal(lock.version,pkg.version);assert.equal(lock.packages?.[""]?.version,pkg.version);'
          new='const [major,minor]=String(pkg.version).split(".").map(Number);assert.ok(major>1||(major===1&&minor>=62));assert.equal(lock.version,pkg.version);assert.equal(lock.packages?.[""]?.version,pkg.version);'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v162-sailplane-spl.test.ts
          git rm .github/workflows/v200-ga-semver-fix.yml
          git commit -m "v2.0.0 allow major-version release metadata"
          git push origin HEAD:codex/v200-ga-release
