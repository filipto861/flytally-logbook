name: Sync v1.69 lock metadata

# One-shot release metadata helper. Removed before merge.
on:
  push:
    branches:
      - codex/v169-production-hardening-ii

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v169-production-hardening-ii
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile release metadata only
        shell: bash
        run: |
          cp package-lock.json /tmp/package-lock.before
          npm install --package-lock-only --ignore-scripts
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/package-lock.before').read_text())
          after=json.loads(Path('package-lock.json').read_text())
          assert after['version']=='1.69.0'
          assert after['packages']['']['version']=='1.69.0'
          before['version']='1.69.0'
          before['packages']['']['version']='1.69.0'
          assert before==after, 'package-lock changed beyond the two release version fields'
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(v1.69): sync lock metadata"
          git push origin HEAD:codex/v169-production-hardening-ii
