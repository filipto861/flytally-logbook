name: M0-B isolated Neon target read-only guard audit

on:
  push:
    branches:
      - test/logbook-m0b-neon-isolated-readonly-20261103
    paths:
      - tooling/m0b-b1b2c-neon-isolation-scope.mjs
      - tooling/m0b-b1b2c-neon-isolation-scope.test.mjs
      - .github/workflows/m0b-b1b2c-neon-isolated-scope.yml

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and fail-closed isolated target guard (no DB)
        run: |
          node --check tooling/m0b-b1b2c-neon-isolation-scope.mjs
          node --check tooling/m0b-b1b2c-neon-isolation-scope.test.mjs
          node --test tooling/m0b-b1b2c-neon-isolation-scope.test.mjs
