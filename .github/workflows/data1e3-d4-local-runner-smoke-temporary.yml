name: DATA1E3 TEMP D4 one-owner-local-PG16 runner syntax and refusal smoke
on:
  push:
    branches:
      - test/logbook-data1e3-d4-one-local-pg16-20261030
    paths:
      - .github/workflows/data1e3-d4-local-runner-smoke-temporary.yml
permissions:
  contents: read
jobs:
  node24-nodb-safety:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify exact test SHA and both JS module syntaxes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ('TESTED_SHA=' + (git rev-parse HEAD))
          Write-Host ('NODE=' + (node --version))
          node --check tooling/data1e3-d4-owned-local-pg16.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Launcher parse error' }
          node --check tooling/data1e3-d4-source-sql-risk-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source-SQL probe parse error' }
          Write-Host 'NODE24_SYNTAX_CHECK_PASS=2'
      - name: Refuse unsafe execution without SHA, confirmation and trusted environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          $cases = @(
            @('--probe'),
            @('--execute', "--expected-sha=$sha", '--allow-synthetic-writes'),
            @('--probe', "--expected-sha=$sha"),
            @('--execute', "--expected-sha=$sha", '--allow-synthetic-writes', '--confirm=DATA1E3-LOCAL-ONLY')
          )
          $i = 0
          foreach($argsCase in $cases) {
            $i++
            $result = & node tooling/data1e3-d4-owned-local-pg16.mjs @argsCase 2>&1
            if ($LASTEXITCODE -eq 0) { throw "Unsafe case $i was accepted" }
            Write-Host "REFUSAL_PASS_CASE=$i"
          }
          $risk = & node tooling/data1e3-d4-source-sql-risk-probe.mjs 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'Source SQL probe ran without owned cluster purpose' }
          Write-Host 'SOURCE_SQL_UNAUTHORIZED_REFUSAL_PASS'
          exit 0
      - name: Do not touch databases
        shell: pwsh
        run: |
          Write-Host 'NO_DB_CONNECTION_NO_INITDB_NO_TEST_RESTORE_NO_DEPLOY'
