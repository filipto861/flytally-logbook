name: v2.0-F dashboard engine updater
on:
  push:
    branches:
      - codex/v200-category-dashboard
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v200-category-dashboard
      - name: Make Dashboard category-aware and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/data/dashboard.ts')
          s=p.read_text()
          s=s.replace("        UPPER(TRIM(COALESCE(f.evidence,''))) evidence,\n", "        UPPER(TRIM(COALESCE(f.evidence,''))) evidence,\n        CASE\n          WHEN UPPER(TRIM(COALESCE(f.regulatory_category,''))) IN ('AEROPLANE','HELICOPTER','BALLOON','SAILPLANE','ULL','OTHER') THEN UPPER(TRIM(COALESCE(f.regulatory_category,'')))\n          WHEN UPPER(TRIM(COALESCE(f.aircraft_class,'')))='ULL' OR UPPER(TRIM(COALESCE(f.evidence,'')))='ULL' THEN 'ULL'\n          WHEN UPPER(TRIM(COALESCE(f.aircraft_class,'')))='GLIDER' THEN 'SAILPLANE'\n          WHEN UPPER(TRIM(COALESCE(f.aircraft_class,'')))='HELICOPTER' THEN 'HELICOPTER'\n          WHEN UPPER(TRIM(COALESCE(f.aircraft_class,'')))='BALLOON' THEN 'BALLOON'\n          WHEN UPPER(TRIM(COALESCE(f.aircraft_class,''))) IN ('SEP','TMG','MEP','SET') THEN 'AEROPLANE'\n          ELSE 'OTHER' END resolved_category,\n",1)
          old="        GREATEST(COALESCE(f.starts,0),0)::int landings,GREATEST(COALESCE(f.landings_day,0),0)::int day_landings,GREATEST(COALESCE(f.landings_night,0),0)::int night_landings,"
          new="        GREATEST(COALESCE(f.starts,0),0)::int legacy_starts,GREATEST(COALESCE(f.landings_day,0),0)::int stored_day_landings,GREATEST(COALESCE(f.landings_night,0),0)::int stored_night_landings,"
          if old not in s: raise SystemExit('landing projection anchor missing')
          s=s.replace(old,new,1)
          old="""    ),base AS MATERIALIZED(\n      SELECT *,role IN ('SAFETY PILOT','PAX','OBSERVER') auxiliary,role NOT IN ('PAX','OBSERVER') dashboard_total,\n        CASE WHEN stored_pic_minutes>0 THEN stored_pic_minutes WHEN role IN ('PIC','SOLO','SPIC','PICUS','INSTRUCTOR','EXAMINER') THEN block_minutes ELSE 0 END::int pic_minutes,\n        hourly*(CASE WHEN billing_basis LIKE 'AIR%' THEN air_minutes ELSE block_minutes END)/60.0/(CASE WHEN split_part(billing_basis,'/',2)~'^[1-9][0-9]*$' AND split_part(billing_basis,'/',2)::int<=20 THEN split_part(billing_basis,'/',2)::numeric ELSE 1 END)::double precision cost\n      FROM base0\n    ),summary AS("""
          new="""    ),base1 AS MATERIALIZED(\n      SELECT *,role IN ('SAFETY PILOT','PAX','OBSERVER') auxiliary,role NOT IN ('PAX','OBSERVER') dashboard_total,\n        CASE WHEN resolved_category IN ('SAILPLANE','BALLOON') THEN CASE WHEN air_minutes>0 THEN air_minutes ELSE block_minutes END ELSE block_minutes END::int logged_minutes,\n        CASE WHEN stored_day_landings+stored_night_landings>0 THEN stored_day_landings ELSE legacy_starts END::int day_landings,\n        stored_night_landings::int night_landings,\n        CASE WHEN stored_day_landings+stored_night_landings>0 THEN stored_day_landings+stored_night_landings ELSE legacy_starts END::int landings,\n        hourly*(CASE WHEN billing_basis LIKE 'AIR%' THEN air_minutes ELSE block_minutes END)/60.0/(CASE WHEN split_part(billing_basis,'/',2)~'^[1-9][0-9]*$' AND split_part(billing_basis,'/',2)::int<=20 THEN split_part(billing_basis,'/',2)::numeric ELSE 1 END)::double precision cost\n      FROM base0\n    ),base AS MATERIALIZED(\n      SELECT *,\n        CASE WHEN stored_pic_minutes>0 THEN stored_pic_minutes WHEN role IN ('PIC','SOLO','SPIC','PICUS','INSTRUCTOR','EXAMINER') THEN logged_minutes ELSE 0 END::int pic_minutes,\n        CASE WHEN role='SAFETY PILOT' THEN block_minutes ELSE logged_minutes END::int activity_minutes\n      FROM base1\n    ),summary AS("""
          if old not in s: raise SystemExit('base CTE anchor missing')
          s=s.replace(old,new,1)
          replacements={
            "SUM(block_minutes) FILTER(WHERE dashboard_total)":"SUM(activity_minutes) FILTER(WHERE dashboard_total)",
            "SUM(block_minutes) FILTER(WHERE evidence='ULL' AND NOT auxiliary)":"SUM(logged_minutes) FILTER(WHERE evidence='ULL' AND NOT auxiliary)",
            "SUM(block_minutes) FILTER(WHERE evidence='EASA' AND NOT auxiliary)":"SUM(logged_minutes) FILTER(WHERE evidence='EASA' AND NOT auxiliary)",
            "SUM(block_minutes) FILTER(WHERE NOT auxiliary AND evidence='ULL')":"SUM(logged_minutes) FILTER(WHERE NOT auxiliary AND evidence='ULL')",
            "SUM(block_minutes) FILTER(WHERE NOT auxiliary AND evidence='EASA')":"SUM(logged_minutes) FILTER(WHERE NOT auxiliary AND evidence='EASA')",
            "SUM(block_minutes) FILTER(WHERE NOT auxiliary),0)::int minutes":"SUM(logged_minutes) FILTER(WHERE NOT auxiliary),0)::int minutes",
            "SUM(block_minutes),0)::int minutes,COALESCE(MIN(date_key)":"SUM(activity_minutes),0)::int minutes,COALESCE(MIN(date_key)",
            "SUM(block_minutes) DESC,MAX(date_key)":"SUM(activity_minutes) DESC,MAX(date_key)",
            "SUM(block_minutes),0)::int minutes,COALESCE(SUM(landings) FILTER(WHERE NOT auxiliary)":"SUM(activity_minutes),0)::int minutes,COALESCE(SUM(landings) FILTER(WHERE NOT auxiliary)"
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit(f'replacement anchor missing: {a}')
              s=s.replace(a,b)
          p.write_text(s)
          Path('.github/workflows/v200-f-dashboard-engine.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/dashboard.ts .github/workflows/v200-f-dashboard-engine.yml
          git commit -m "v2.0-F make Dashboard category-aware"
          git push origin HEAD:codex/v200-category-dashboard
