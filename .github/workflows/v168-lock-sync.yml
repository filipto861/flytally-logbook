name: v1.68 lock metadata sync

on:
  push:
    branches:
      - codex/v168-statistics-pilot-insights

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize lockfile release version only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('package-lock.json')
          text = p.read_text()
          old = '"version": "1.67.0"'
          if text.count(old) != 2:
              raise SystemExit(f'Expected exactly 2 root version occurrences, found {text.count(old)}')
          text = text.replace(old, '"version": "1.68.0"', 2)
          p.write_text(text)
          PY
          git diff --check
          changed=$(git diff --numstat -- package-lock.json)
          test "$changed" = $'2\t2\tpackage-lock.json'
      - name: Commit lock metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(v1.68): sync lock metadata"
          git push
