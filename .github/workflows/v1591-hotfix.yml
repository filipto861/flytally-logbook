name: FlyTally v1.59.1 migration hotfix

on:
  push:
    branches:
      - codex/v1591-migration14-hotfix
    paths:
      - .github/workflows/v1591-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1591-migration14-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply migration 14 runner hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); text=p.read_text(); found=text.count(old)
              if found < count: raise SystemExit(f"{path}: expected {count}, found {found}: {old[:100]!r}")
              p.write_text(text.replace(old,new,count))

          rep('package.json','"version": "1.59.0"','"version": "1.59.1"')
          rep('package-lock.json','"version": "1.59.0"','"version": "1.59.1"',2)
          rep('tests/v159-flight-entry-structure-expenses.test.ts','assert.equal(pkg.version,"1.59.0");','const [major,minor]=String(pkg.version).split(".").map(Number);assert.ok(major>1||(major===1&&minor>=59));')

          rep('lib/db-optimization.ts','  13:"crew connections and verified approvals",\n};','  13:"crew connections and verified approvals",\n  14:"user-owned structured flight expenses",\n};')
          anchor='  throw new Error(`Unknown database migration ${version}`);\n};'
          migration='''  if(version===14)return[\n    sql`CREATE UNIQUE INDEX IF NOT EXISTS flights_id_user_owner_uq ON flights(id,user_id)`,\n    sql`CREATE TABLE IF NOT EXISTS flight_expenses (\n      id BIGSERIAL PRIMARY KEY,\n      user_id BIGINT NOT NULL,\n      flight_id BIGINT NOT NULL,\n      category TEXT NOT NULL,\n      label TEXT NOT NULL DEFAULT '',\n      amount_minor BIGINT NOT NULL CHECK(amount_minor>0 AND amount_minor<=1000000000),\n      currency TEXT NOT NULL CHECK(currency ~ '^[A-Z]{3}$'),\n      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n      CONSTRAINT flight_expenses_owner_flight_fk FOREIGN KEY(flight_id,user_id) REFERENCES flights(id,user_id) ON DELETE CASCADE\n    )`,\n    sql`CREATE INDEX IF NOT EXISTS idx_flight_expenses_user_flight ON flight_expenses(user_id,flight_id,id)`,\n    sql`ALTER TABLE deleted_flights ADD COLUMN IF NOT EXISTS expenses_data JSONB NOT NULL DEFAULT '[]'::jsonb`,\n  ];\n'''
          rep('lib/db-optimization.ts',anchor,migration+anchor)

          p=Path('CHANGELOG.md'); text=p.read_text(); anchor='## 1.59.0 — Flight Entry Structure & Expenses'
          section='''## 1.59.1 — Database Migration Hotfix — 2026-09-01\n\n- Fixed production startup failure `Unknown database migration 14`.\n- Added the v1.59 structured-expense schema to the primary sequential database migration runner.\n- No flight, regulatory, certification, expense ownership or currency semantics changed.\n\n'''
          if anchor not in text: raise SystemExit('CHANGELOG v1.59 anchor missing')
          p.write_text(text.replace(anchor,section+anchor,1))

          Path('tests/v1591-migration-hotfix.test.ts').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst db=fs.readFileSync("lib/db-optimization.ts","utf8");\nconst pkg=JSON.parse(fs.readFileSync("package.json","utf8"));\nconst lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));\n\ntest("v1.59.1 package metadata is synchronized",()=>{\n  assert.equal(pkg.version,"1.59.1");\n  assert.equal(lock.version,pkg.version);\n  assert.equal(lock.packages[""].version,pkg.version);\n});\n\ntest("primary database runner implements migration 14",()=>{\n  assert.match(db,/14:\"user-owned structured flight expenses\"/);\n  assert.match(db,/if\(version===14\)return\[/);\n  assert.match(db,/CREATE TABLE IF NOT EXISTS flight_expenses/);\n  assert.match(db,/FOREIGN KEY\(flight_id,user_id\) REFERENCES flights\(id,user_id\) ON DELETE CASCADE/);\n  assert.match(db,/ALTER TABLE deleted_flights ADD COLUMN IF NOT EXISTS expenses_data/);\n});\n''')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        run: npm run test:postgres
      - run: npm run build
      - name: Commit validated hotfix
        shell: bash
        run: |
          rm -f flytally-postgres-acceptance.txt flytally-scale-evidence.json
          rm -f .github/workflows/v1591-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.59.1 — database migration 14 hotfix"
          git push origin HEAD:codex/v1591-migration14-hotfix
