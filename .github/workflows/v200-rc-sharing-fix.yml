name: v2.0-RC sharing compatibility fixup
on:
  push:
    branches: [codex/v200-rc-multicategory-hardening]
    paths: [.github/workflows/v200-rc-sharing-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v200-rc-multicategory-hardening
      - name: Patch sharing resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/(protected)/flights/shared-actions.ts')
          s=p.read_text()
          old='import { refreshRecencySnapshot } from "@/lib/recency-service";'
          new='import { refreshRecencySnapshot } from "@/lib/recency-service";import { resolveRegulatoryAircraftCategory } from "@/lib/aircraft-category";'
          assert old in s and 'resolveRegulatoryAircraftCategory' not in s
          s=s.replace(old,new,1)
          old2='const role=participantLogbookRole(participantRole),block=flightMinutes(text(row.off_block),text(row.on_block)),air=flightMinutes(text(row.takeoff),text(row.landing)),creditMinutes=["SAILPLANE","BALLOON"].includes(text(row.regulatory_category).toUpperCase())?(air||block):block,credit=crewRoleCredits(participantRole,creditMinutes)'
          new2='const role=participantLogbookRole(participantRole),block=flightMinutes(text(row.off_block),text(row.on_block)),air=flightMinutes(text(row.takeoff),text(row.landing)),resolvedCategory=resolveRegulatoryAircraftCategory({regulatoryCategory:row.regulatory_category,aircraftClass:row.aircraft_class,evidence:row.evidence}),creditMinutes=["SAILPLANE","BALLOON"].includes(resolvedCategory)?(air||block):block,credit=crewRoleCredits(participantRole,creditMinutes)'
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s)
          Path('.github/workflows/v200-rc-sharing-fix.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v2.0-RC resolve legacy categories for shared-flight credit"
          git push origin HEAD:codex/v200-rc-multicategory-hardening