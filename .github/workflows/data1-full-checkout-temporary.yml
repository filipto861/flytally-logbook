name: DATA-1 full checkout verification (temporary)

on:
  push:
    branches:
      - chore/logbook-data1-full-ci-20261029

permissions:
  contents: read

concurrency:
  group: data1-full-checkout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node24 complete-repository diagnostic (NO DB / NO DEPLOY)
    if: github.repository == 'filipto861/flytally-logbook'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DATABASE_URL: ""
      NEON_DATABASE_URL: ""
      FLYTALLY_LOCAL_POSTGRES: ""
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - name: Exact private repository checkout (read-only credential)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Pin Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Record verified source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --version
          git rev-parse HEAD
      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Plan affected data-integrity scope (read only)
        run: npm run scope:changed -- lib/local-postgres.ts lib/local-postgres-transaction.ts lib/account-backup.ts lib/account-backup-snapshot.ts lib/account-backup-presign.ts lib/portable-backup.ts
      - name: Full repository TypeScript check
        run: npm run typecheck
      - name: Full Node unit and regression tests
        run: npm test
      - name: Production build diagnostic (NOT a deployment)
        run: npm run build

  postgres:
    name: Isolated host-loopback PG16 core acceptance (NO NEON)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      DATABASE_URL: postgresql://flytally@127.0.0.1:55432/flytally_currency_test
      FLYTALLY_LOCAL_POSTGRES: "1"
      FLYTALLY_POSTGRES_INTEGRATION: "1"
      FLYTALLY_D2_FULL_V20_DISPOSABLE: "1"
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-not-for-production
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bootstrap separate host-loopback PG16 at port 55432
        shell: bash
        run: |
          set -euo pipefail
          bin=/usr/lib/postgresql/16/bin
          test -x "$bin/initdb"
          test -x "$bin/pg_ctl"
          sudo install -d -o postgres -g postgres -m 0700 /tmp/flytally-data1-pg16
          sudo -u postgres "$bin/initdb" -D /tmp/flytally-data1-pg16 -U flytally --auth-host=trust --auth-local=trust --no-instructions >/dev/null
          sudo -u postgres "$bin/pg_ctl" -D /tmp/flytally-data1-pg16 -o "-h 127.0.0.1 -p 55432 -k /tmp" -l /tmp/flytally-data1-pg16.log -w start
          "$bin/createdb" -h 127.0.0.1 -p 55432 -U flytally flytally_currency_test
          "$bin/psql" -d "$DATABASE_URL" -Atqc "SELECT current_database()||'|'||host(inet_server_addr())||'|'||inet_server_port()"
      - name: PostgreSQL core acceptance on exact disposable host-loopback target
        run: npm run test:postgres
      - name: Stop and clean isolated PostgreSQL process
        if: always()
        shell: bash
        run: |
          if test -f /tmp/flytally-data1-pg16/postmaster.pid; then
            sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D /tmp/flytally-data1-pg16 -m immediate -w stop
          fi
          if test -d /tmp/flytally-data1-pg16; then
            sudo rm -rf /tmp/flytally-data1-pg16
          fi

  browser:
    name: Bounded v13 signed-backup desktop and mobile risk smoke (NO NEON)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      DATABASE_URL: postgresql://flytally@127.0.0.1:55433/flytally_currency_test
      FLYTALLY_LOCAL_POSTGRES: "1"
      FLYTALLY_AUTH_BROWSER: "1"
      FLYTALLY_CURRENCY_V21_BROWSER: "1"
      FLYTALLY_V21_RISK_BROWSER: "1"
      FLYTALLY_BROWSER_EVIDENCE_FILE: data1-browser-evidence.json
      FLYTALLY_BROWSER_PASSWORD: FlyTally-Synthetic-CI-2026!
      SESSION_SECRET: flytally-browser-session-secret-not-production
      SIGNING_SECRET: flytally-browser-signing-secret-not-production
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bootstrap purpose-owned host-loopback PG16 on port 55433
        shell: bash
        run: |
          set -euo pipefail
          bin=/usr/lib/postgresql/16/bin
          test -x "$bin/initdb"
          sudo install -d -o postgres -g postgres -m 0700 /tmp/flytally-data1-browser-pg16
          sudo -u postgres "$bin/initdb" -D /tmp/flytally-data1-browser-pg16 -U flytally --auth-local=trust --auth-host=trust --no-instructions >/dev/null
          sudo -u postgres "$bin/pg_ctl" -D /tmp/flytally-data1-browser-pg16 -o "-h 127.0.0.1 -p 55433 -k /tmp" -l /tmp/flytally-data1-browser-pg16.log -w start
          "$bin/createdb" -h 127.0.0.1 -p 55433 -U flytally flytally_currency_test
      - name: Install repository-pinned Chromium for supported Ubuntu 24.04
        run: npx --no-install playwright install --with-deps chromium
      - name: Diagnostic Next.js build (NO DEPLOY)
        run: npm run build
      - name: Signed v13 backup and restore - desktop, one test, no retries
        run: >
          node tooling/run-auth-browser.mjs
          --currency-v21-risk e2e/trash-integrity.spec.mjs
          --project=desktop-chromium
          --grep='Currency 3.8 browser: signed portable v13 restores exact flight and expense currency'
          --retries=0 --workers=1
      - name: Signed v13 backup and restore - mobile, one test, no retries
        run: >
          node tooling/run-auth-browser.mjs
          --currency-v21-risk e2e/trash-integrity.spec.mjs
          --project=mobile-chromium
          --grep='Currency 3.8 browser: signed portable v13 restores exact flight and expense currency'
          --retries=0 --workers=1
      - name: Remove isolated browser database files and stop PG process
        if: always()
        shell: bash
        run: |
          if test -f /tmp/flytally-data1-browser-pg16/postmaster.pid; then
            sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D /tmp/flytally-data1-browser-pg16 -m immediate -w stop
          fi
          if test -d /tmp/flytally-data1-browser-pg16; then
            sudo rm -rf /tmp/flytally-data1-browser-pg16
          fi
