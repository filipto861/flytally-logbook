name: v2.0-D typefix
on:
  push:
    branches:
      - codex/v200-multicategory-statistics
jobs:
  typefix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v200-multicategory-statistics
      - name: Fix awaited rows type
        shell: python
        run: |
          from pathlib import Path
          p=Path('lib/data/pilot-insights.ts')
          s=p.read_text()
          old='as Promise<Array<Record<string,unknown>>>;'
          assert old in s
          p.write_text(s.replace(old,'as Array<Record<string,unknown>>;',1))
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v200-d-typefix.yml
          git add lib/data/pilot-insights.ts
          git commit -m "v2.0-D fix awaited Statistics rows type"
          git push
