name: Finalize FlyTally v1.57

on:
  push:
    branches:
      - codex/v1570-flight-entry-workflow
    paths:
      - .github/workflows/v157-finalize.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1570-flight-entry-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make disclosure auto-open one-way
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/flight-form.tsx'); s=p.read_text()
          old='const logbookSectionOpen=evidence==="EASA"||!evidence||!aircraftClass||countersignatureRequired,costSectionOpen=!billing;'
          new='const[logbookOpen,setLogbookOpen]=useState(initialEvidence==="EASA"||!initialEvidence||!initialClass||["SPIC","PICUS"].includes(initialRole)),[costOpen,setCostOpen]=useState(!initialBillingBasis);'
          if old not in s: raise SystemExit('disclosure state anchor missing')
          s=s.replace(old,new,1)
          old='useEffect(()=>{if(!editing&&!movementTouched)setMovementRecorded(autoMovement(evidence,role,operationType))},[editing,evidence,role,operationType,movementTouched]);'
          new=old+'\n  useEffect(()=>{if(evidence==="EASA"||!evidence||!aircraftClass||countersignatureRequired)setLogbookOpen(true)},[evidence,aircraftClass,countersignatureRequired]);\n  useEffect(()=>{if(!billing)setCostOpen(true)},[billing]);'
          if old not in s: raise SystemExit('movement effect anchor missing')
          s=s.replace(old,new,1)
          old='<details className="entry-section" open={logbookSectionOpen}><summary><span>Logbook details</span>'
          new='<details className="entry-section" open={logbookOpen} onToggle={event=>setLogbookOpen(event.currentTarget.open)}><summary><span>Logbook details</span>'
          if old not in s: raise SystemExit('logbook details anchor missing')
          s=s.replace(old,new,1)
          old='<details className="entry-section" open={costSectionOpen}><summary><span>Cost & notes</span>'
          new='<details className="entry-section" open={costOpen} onToggle={event=>setCostOpen(event.currentTarget.open)}><summary><span>Cost & notes</span>'
          if old not in s: raise SystemExit('cost details anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        shell: bash
        run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tee flytally-postgres-acceptance.txt
      - run: npm run build
      - name: Commit clean validated release tree
        shell: bash
        run: |
          rm -f flytally-postgres-acceptance.txt flytally-scale-evidence.json
          rm -f .github/workflows/v157-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.57.0 finalize guided disclosure and release record"
          git push origin HEAD:codex/v1570-flight-entry-workflow
