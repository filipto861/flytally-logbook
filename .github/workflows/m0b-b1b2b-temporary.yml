name: Temporary M0-B B1b.2b lock contention verification

on:
  push:
    branches:
      - fix/logbook-m0b-b1b2b-lock-contention-20261102

permissions:
  contents: read

concurrency:
  group: m0b-b1b2b-isolated
  cancel-in-progress: true

jobs:
  b1a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: b1a_test
          POSTGRES_PASSWORD: b1a_synthetic_ci_only
          POSTGRES_DB: b1a_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U b1a_test -d b1a_synthetic"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://b1a_test:b1a_synthetic_ci_only@127.0.0.1:5432/b1a_synthetic
      PGPASSWORD: b1a_synthetic_ci_only
      SIGNING_SECRET: b1a-synthetic-ci-signing-secret-not-for-users
      AUTH_SECRET: b1a-synthetic-ci-auth-secret-not-for-users
      FLYTALLY_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Source restore guard (M0-A + B1b)
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "0"
          DATABASE_URL: ""
        run: npm run test:target -- tests/m0-account-restore-containment.test.ts tests/recovery-parent-identity.test.ts
      - name: TypeScript
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "0"
          DATABASE_URL: ""
        run: npm run typecheck
      - name: Validate canonical 42-file / 164-case PostgreSQL registry
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "0"
          DATABASE_URL: ""
        run: node tooling/validate-postgres-partition-registry.mjs
      - name: Full Node unit/regression suite (no database)
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "0"
          DATABASE_URL: ""
        run: npm test
      - name: Next.js production build (synthetic only)
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "0"
        run: npm run build
      - name: Check exact isolated CI postgres identity (before SQL fixture)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CI:-unset}" != "true" ]]; then echo "B1A_NOT_CI"; exit 1; fi
          expected="postgresql://b1a_test:b1a_synthetic_ci_only@127.0.0.1:5432/b1a_synthetic"
          if [[ "$DATABASE_URL" != "$expected" ]]; then echo "B1A_DATABASE_URL_TARGET_MISMATCH"; exit 1; fi
          identity="$(psql -X -w "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT current_database()||'|'||current_user||'|'||host(inet_server_addr())||'|'||inet_server_port()||'|'||current_setting('server_version_num')")"
          echo "B1A_SYNTHETIC_IDENTITY=$identity"
          if [[ ! "$identity" =~ ^b1a_synthetic\|b1a_test\|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}\|5432\|16[0-9]{4}$ ]]; then
            echo "B1A_CLUSTER_IDENTITY_MISMATCH"; exit 1
          fi
          echo "B1A_LOCALHOST_TO_PRIVATE_DOCKER_PG16_PASS"
      - name: B1a PG16 real two-session synthetic regression
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --experimental-strip-types tests/integration/postgres-security-restore.test.ts
