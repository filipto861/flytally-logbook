name: v2.3 release metadata closure
on:
  push:
    branches: [codex/v230-release-metadata]
    paths: [.github/workflows/v230-release-metadata.yml]
permissions:
  contents: write
jobs:
  close-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v230-release-metadata
      - name: Align v2.3 release metadata
        shell: python
        run: |
          from pathlib import Path
          import json,re
          for name in ['package.json','package-lock.json']:
            p=Path(name); data=json.loads(p.read_text()); data['version']='2.3.0'
            if name=='package-lock.json': data['packages']['']['version']='2.3.0'
            p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          p=Path('ROADMAP.md'); s=p.read_text()
          pattern=r'## Current release — v2\.2\.0 — Action Center & Shared Flight Workflow[\s\S]*?(?=### v2\.4 — Flight Entry & Review 2\.0)'
          new="## Current release — v2.3.0 — Large Logbook Performance & Scalability\n\n- Retain 10k/50k release gates and add a controlled 100k-flight read-performance gate for production hot paths.\n- Keep Dashboard concise with a lean at-a-glance read model instead of recomputing Statistics aggregates.\n- Keep complete Print preparation bounded by resolving latest aircraft and signed-verification metadata set-wise rather than once per flight row.\n- Compute only the aggregates required by the active Statistics section while preserving the canonical multi-category time/category engine and backward-compatible all-section mode.\n- Preserve v2.2 Action Center workflows, v2.1 Dashboard/Statistics information architecture, v2.0 regulatory semantics and certified-data integrity without a schema change or historical-row rewrite.\n\n## Post-v2.3 roadmap\n\nThe next roadmap phase prioritizes workflow quality and product consistency before another major expansion of regulatory scope.\n\n"
          s2,count=re.subn(pattern,new,s,count=1); assert count==1; p.write_text(s2)
      - name: Commit metadata and remove helper
        run: |
          rm .github/workflows/v230-release-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(v2.3): align release metadata"
          git push origin HEAD:codex/v230-release-metadata