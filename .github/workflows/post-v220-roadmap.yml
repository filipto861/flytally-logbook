name: post-v2.2 roadmap updater
on:
  push:
    branches:
      - codex/post-v220-roadmap
permissions:
  contents: write
jobs:
  update-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-v220-roadmap
          fetch-depth: 0
      - name: Insert post-v2.2 roadmap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ROADMAP.md')
          fragment=Path('ROADMAP_POST_V220.fragment.md').read_text().rstrip()+"\n\n"
          text=p.read_text()
          marker='## v2.1.0 — Dashboard & Statistics consolidation'
          assert marker in text
          assert '## Post-v2.2 roadmap' not in text
          p.write_text(text.replace(marker,fragment+marker,1))
          PY
          git rm .github/workflows/post-v220-roadmap.yml ROADMAP_POST_V220.fragment.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "Document post-v2.2 roadmap"
          git push origin HEAD:codex/post-v220-roadmap
