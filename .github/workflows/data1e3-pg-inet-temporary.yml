name: DATA1E3 TEMP Windows Node24 PG inet host and safe-fixture regressions (NO DB)
on:
  push:
    branches:
      - test/logbook-data1e3-d4-one-local-pg16-20261030
    paths:
      - .github/workflows/data1e3-pg-inet-temporary.yml
permissions:
  contents: read
jobs:
  no-db-contract:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Source identity and JS syntax
        shell: pwsh
        run: |
          Write-Host ('EXACT_SHA=' + (git rev-parse HEAD))
          Write-Host ('NODE=' + (node --version))
          node --check tooling/data1e3-d4-owned-local-pg16.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Launcher syntax failed' }
          node --check tooling/data1e3-d4-source-sql-risk-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Risk probe syntax failed' }
          node --check tooling/data1e3-d4-pg-identity-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Regression syntax failed' }
      - name: Strict local IPv4 host and synthetic fixture source regression
        shell: pwsh
        run: |
          node --test tooling/data1e3-d4-pg-identity-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'D4 Postgres localhost/fixture regression failed' }
      - name: Refuse any real DB operations in hosted test
        shell: pwsh
        run: |
          Write-Host 'NO INITDB, NO POSTGRES, NO DATABASE, NO SQL, NO RESTORE, NO DEPLOY'
