name: DATA1E3 TEMP DeepSeek read-only frozen reviewer packet (NO DB)
on:
  push:
    branches:
      - docs/logbook-data1e3-d4-confirmed-risk-design-20261030
    paths:
      - .github/workflows/data1e3-deepseek-packet-temporary.yml
permissions:
  contents: read
jobs:
  freeze-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout immutable executable source #446
        uses: actions/checkout@v4
        with:
          ref: cf2332d3814fd5f97096608680dffdb1d457c5df
          path: frozen-source
          persist-credentials: false
      - name: Checkout immutable reviewer docs #447
        uses: actions/checkout@v4
        with:
          ref: c88432eaa662f425d58444f4873cb19cae89bbfb
          path: frozen-review
          persist-credentials: false
      - name: Generate exact-source manifest and standalone DeepSeek volumes (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          
          import hashlib, json, pathlib, subprocess, datetime, re
          from collections import defaultdict
          
          SOURCE=pathlib.Path('frozen-source')
          REVIEW=pathlib.Path('frozen-review')
          OUT=pathlib.Path('packet')
          SOURCE_SHA='cf2332d3814fd5f97096608680dffdb1d457c5df'
          REVIEW_SHA='c88432eaa662f425d58444f4873cb19cae89bbfb'
          MAIN_SHA='807f281e5870164b794d001480ecc84e0b45aea5'
          GROUPS=json.loads(r'''{"01_CORE_RESTORE_AND_CERTIFICATION":["lib/account-restore-v6.ts","lib/account-backup.ts","lib/account-backup-snapshot.ts","lib/account-backup-presign.ts","lib/portable-backup.ts","lib/backup-center.ts","lib/backup-authenticity.ts","lib/backup-certification.ts","lib/certification-integrity.ts","lib/recovery-conflict.ts","lib/recovery-preview.ts","lib/recovery-scale.ts","lib/db.ts","lib/local-postgres.ts","lib/local-postgres-transaction.ts","lib/flight-audit.ts","lib/flight-certification.ts","lib/flight-voiding.ts","lib/void-evidence.ts","lib/flight-trash.ts"],"02_APP_AUTH_AND_ENDPOINTS":["app/(protected)/export/actions.ts","app/(protected)/export/page.tsx","app/(protected)/data/page.tsx","app/api/backups/[id]/route.ts","lib/auth/session.ts","lib/auth/require-user.ts","components/backup-restore.tsx"],"03_SCHEMA_MIGRATION_AND_TRIGGERS":["lib/db-optimization.ts","lib/v162-schema.ts","lib/v163-schema.ts","lib/v164-schema.ts","lib/v165-schema.ts","lib/v166-schema.ts","lib/runtime-schema.ts","lib/push-schema.ts","lib/migration-plan.ts","lib/currency-v21-migration-safety.ts","sql/drafts/3_8_0_currency_v21_additive_candidate.sql","lib/v159-schema.ts","lib/v151-schema.ts"],"04_TESTS_AND_ACCEPTANCE":["tests/integration/postgres-security-restore.test.ts","tests/integration/postgres-backup-v13-void-history.test.ts","tests/integration/postgres-certified-flight-voiding-schema.test.ts","tests/integration/postgres-certified-flight-voiding-collaboration.test.ts","tests/integration/postgres-v380-full-v20-restore.test.ts","tests/integration/v380-restore-lock-and-trigger-contract.test.ts","tests/integration/postgres-v380-d3b-real-trash-races.test.ts","tests/v381-data1e3-stored-recovery-guards.test.ts","tests/v350-backup-v13.test.ts","tests/v350-certified-flight-voiding-backup-v13.test.ts","tests/backup-certification.test.ts","tests/v270-data-integrity-recovery.test.ts","tests/v270-recovery-scale.test.ts","tests/portable-backup.test.ts","tests/v1332-security-restore.test.ts","tests/v380-currency-restore-expense-identity.test.ts"],"05_TEST_RUNNERS_AND_REGISTRY":["tooling/data1e3-d4-owned-local-pg16.mjs","tooling/data1e3-d4-source-sql-risk-probe.mjs","tooling/data1e3-d4-win-process-path.mjs","tooling/data1e3-d4-win-process-path.test.mjs","tooling/data1e3-d4-pg-identity-contract.test.mjs","tooling/data1e3-d4-pgctl-stdio.test.mjs","tooling/development-modules.json","tooling/postgres-partition-registry.json","tooling/run-auth-browser.mjs","tooling/verify-postgres.mjs","tooling/development-modules.schema.json","package.json"],"06_PROJECT_CONTRACTS":["AGENTS.md",".agents/skills/README.md",".agents/skills/database-security/SKILL.md",".agents/skills/testing-quality/SKILL.md",".agents/skills/flight-integrity/SKILL.md",".agents/skills/release-workflow/SKILL.md","ARCHITECTURE.md","DEVELOPMENT.md","docs/AI_HANDOFF_TEMPLATE.md","docs/PROJECT_MEMORY/HANDOFF_PROTOCOL.md"]}''')
          REVIEW_DOCS=json.loads(r'''["docs/maintenance/2026-10-30-data1e3-d4-confirmed-synthetic-sql-evidence.md","docs/maintenance/2026-10-30-data1e3-d4-fail-closed-hardening-design.md","docs/maintenance/2026-10-30-data1e3-d4-independent-readonly-review-brief.md","docs/maintenance/2026-10-30-data1e-deepseek-independent-review-reconciliation.md","docs/maintenance/2026-10-30-data1e3-d4-local-pg16-acceptance-gate.md","docs/maintenance/2026-10-30-data1e3-hardening-milestones.md","docs/maintenance/2026-10-30-data1e3-registry-windows-acceptance-evidence.md","docs/maintenance/2026-10-30-data1e3-d4-single-cluster-windows-runbook.md","docs/maintenance/2026-10-30-data1e3-d4-third-windows-process-cli-path-fix.md"]''')
          EXCERPTS={'ROADMAP.md':160,'FEATURES.md':100,'CHANGELOG.md':115,'docs/PROJECT_MEMORY/SESSION_HANDOFF.md':115,'docs/PROJECT_MEMORY/ACTIVE_WORK.md':105}
          def git_at(folder,*args):
              return subprocess.check_output(['git','-C',str(folder),*args],text=True).strip()
          assert git_at(SOURCE,'rev-parse','HEAD')==SOURCE_SHA,'Source checkout SHA mismatch'
          assert git_at(REVIEW,'rev-parse','HEAD')==REVIEW_SHA,'Review checkout SHA mismatch'
          def blob_tree(folder):
              lines=git_at(folder,'ls-tree','-r','--full-tree','HEAD').splitlines()
              return {line.split('\t',1)[1]:line.split('\t',1)[0].split()[2] for line in lines}
          old_tree=blob_tree(SOURCE)
          new_tree=blob_tree(REVIEW)
          delta=sorted(p for p in set(old_tree)|set(new_tree) if old_tree.get(p)!=new_tree.get(p))
          allowed={'ROADMAP.md','docs/PROJECT_MEMORY/ACTIVE_WORK.md','docs/PROJECT_MEMORY/SESSION_HANDOFF.md',
          'docs/maintenance/2026-10-30-data1e3-d4-confirmed-synthetic-sql-evidence.md',
          'docs/maintenance/2026-10-30-data1e3-d4-fail-closed-hardening-design.md',
          'docs/maintenance/2026-10-30-data1e3-d4-independent-readonly-review-brief.md'}
          assert set(delta)==allowed, f'Docs snapshot changed unexpected paths: {delta}'
          assert len({p for arr in GROUPS.values() for p in arr})==sum(len(arr) for arr in GROUPS.values()), 'duplicate source filename'
          assert not any('..' in pathlib.PurePosixPath(p).parts or p.startswith('/') for g in GROUPS.values() for p in g),'unsafe path'
          assert len(REVIEW_DOCS)==len(set(REVIEW_DOCS))
          def read_file(root,p):
              f=root/p
              assert f.is_file() and not f.is_symlink(),f'Missing/nonregular file: {root}/{p}'
              b=f.read_bytes()
              assert len(b)<1200000,f'Over-size curated input: {p}'
              s=b.decode('utf-8','strict')
              assert b'\0' not in b,f'Binary not permitted: {p}'
              return b,s
          def sha(b):return hashlib.sha256(b).hexdigest()
          def write(p,data):
              p=OUT/p
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data if isinstance(data,bytes) else data.encode('utf8'))
          def label(s):return s.split('.')[-1].replace('ts','typescript') if '.' in s else 'text'
          manifest=[]
          volumes=[]
          def track(origin,path,data,kind,where):
              manifest.append({'origin':origin,'repo_path':path,'archive_path':where,'type':kind,
                               'bytes':len(data),'sha256':sha(data),
                               'original_lines':data.count(b'\n')+(0 if not data or data.endswith(b'\n') else 1)})
          for group,paths in GROUPS.items():
              pieces=[]
              for p in paths:
                  data,s=read_file(SOURCE,p)
                  where='EXACT_SOURCE/'+p
                  write(where,data)
                  track(SOURCE_SHA,p,data,'exact-byte-unmodified',where)
                  chunk='\n## '+p+'\n\nSource SHA: '+SOURCE_SHA+'; SHA256: '+sha(data)+'; exact lines below; raw file also in EXACT_SOURCE.\n\n~~~~~~~~\n'+s.rstrip('\n')+'\n~~~~~~~~\n'
                  pieces.append((p,chunk))
              # Split whole-file sections only, to preserve stable paths and reviewer navigation.
              part=1;buf='# '+group+' — source snapshot '+SOURCE_SHA+'\n\n'
              for p,chunk in pieces:
                  if len(buf.encode('utf8'))+len(chunk.encode('utf8'))>130000 and len(buf)>200:
                      name='VOLUMES/'+group+'_PART_'+str(part).zfill(2)+'.md'
                      write(name,buf)
                      volumes.append(name)
                      part+=1;buf='# '+group+' — part '+str(part)+' — source '+SOURCE_SHA+'\n\n'
                  buf+=chunk
              name='VOLUMES/'+group+'_PART_'+str(part).zfill(2)+'.md'
              write(name,buf);volumes.append(name)
          for p in REVIEW_DOCS:
              data,s=read_file(REVIEW,p)
              where='REVIEW_DOCS/'+p
              write(where,data)
              track(REVIEW_SHA,p,data,'exact-byte-unmodified',where)
          docchunks=[]
          for p in REVIEW_DOCS:
              data,s=read_file(REVIEW,p)
              docchunks.append(('\n## '+p+'\n\nReview SHA: '+REVIEW_SHA+'; SHA256: '+sha(data)+'\n\n~~~~~~~~\n'+s.rstrip('\n')+'\n~~~~~~~~\n'))
          buf='# 07 REVIEW: exact frozen docs '+REVIEW_SHA+'\n\n'; part=1
          for chunk in docchunks:
              if len(buf.encode('utf8'))+len(chunk.encode('utf8'))>130000 and len(buf)>200:
                  name='VOLUMES/07_REVIEW_DOCS_PART_'+str(part).zfill(2)+'.md';write(name,buf);volumes.append(name)
                  part+=1;buf='# 07 REVIEW PART '+str(part)+'\n\n'
              buf+=chunk
          name='VOLUMES/07_REVIEW_DOCS_PART_'+str(part).zfill(2)+'.md';write(name,buf);volumes.append(name)
          for p,lines in EXCERPTS.items():
              full,s=read_file(REVIEW,p)
              excerpt=''.join(s.splitlines(keepends=True)[:lines])
              where='CANONICAL_EXCERPTS/'+p+'.excerpt.md'
              banner=('# REVIEW CONTEXT — EXCERPT ONLY\n'
                + 'Exact file: '+p+' at '+REVIEW_SHA+'\n'
                + 'Only original lines 1-'+str(min(lines,len(s.splitlines())))+' included. '
                + 'Full original SHA256: '+sha(full)+'; do NOT treat this excerpt as the complete document.\n\n')
              out=(banner+excerpt).encode('utf8')
              write(where,out)
              track(REVIEW_SHA,p,out,'annotated-lines-1-'+str(lines),where)
          prompt_path='docs/maintenance/2026-10-30-data1e3-d4-independent-readonly-review-brief.md'
          prompt_data,_=read_file(REVIEW,prompt_path)
          write('00_DEEPSEEK_REVIEW_PROMPT.md',prompt_data)
          manifest_data={'packet_version':1,
                         'repository':'filipto861/flytally-logbook',
                         'source_executable_full_sha':SOURCE_SHA,
                         'review_docs_full_sha':REVIEW_SHA,
                         'canonical_main_full_sha':MAIN_SHA,
                         'review_design_original_frozen_sha':'48cd4394ed4decb49924dd0c718a9c6932617cfd',
                         'source_file_count':sum(len(g) for g in GROUPS.values()),
                         'review_document_count':len(REVIEW_DOCS),
                         'canonical_excerpt_count':len(EXCERPTS),
                         'volume_count':len(volumes),
                         'no_sql_or_restore_executed_by_package_builder':True,
                         'no_prod_db_or_training_modified':True,
                         'artifact_policy':'private GitHub Actions, allowlisted tracked source and docs only',
                         'entries':manifest}
          write('01_SOURCE_MANIFEST.json',json.dumps(manifest_data,indent=2,ensure_ascii=False)+'\n')
          volumes_s='\n'.join('- '+p for p in volumes)
          start='# FlyTally DATA-1E3 D4 — DEEPSEEK REVIEW PACKET\n\n'
          start+='This is a complete, curated read-only reviewer packet for D4 flight/FSTD/audit recovery hardening. It is NOT the entire repository and is NOT approval for production. No code is changed by the review; no real user records/GPS or credentials are included by the explicit file allowlist.\n\n'
          start+='## Freeze\n\n- Canonical main: '+MAIN_SHA+'\n- **EXACT executable source** (Draft PR #446): '+SOURCE_SHA+'\n- **EXACT proposal/review docs** (Draft PR #447): '+REVIEW_SHA+'\n- Original frozen design commit: 48cd4394ed4decb49924dd0c718a9c6932617cfd (same design, later doc checkpoints).\n- Source/Design delta consists only of six documentation files, asserted at build.\n\n'
          start+='## What DeepSeek should read\n\n1. Read **00_DEEPSEEK_REVIEW_PROMPT.md** and answer R1–R10 in its exact requested format.\n2. Read **REVIEW_DOCS/docs/maintenance/2026-10-30-data1e3-d4-confirmed-synthetic-sql-evidence.md** for actual owner-local test, limits and observed F3/F9.\n3. Read **REVIEW_DOCS/docs/maintenance/2026-10-30-data1e3-d4-fail-closed-hardening-design.md** for options A/B and acceptance.\n4. Read thematic volumes below; each file label identifies its exact source path and SHA256. **EXACT_SOURCE/** stores the original unchanged source files.\n5. If DeepSeek limits file uploads, upload the prompt and volumes in successive messages with the SAME immutable SHA, then ask for consolidated report after all volumes are read; never let the reviewer claim unseen files were inspected.\n\n'
          start+='### Thematic volumes (read in order)\n'+volumes_s+'\n\n'
          start+='## Evidence status (never convert FAIL into PASS)\n\n'
          start+='- Owner-only Windows Node24 / freshly owned local PG16 source SHA '+SOURCE_SHA+': identity PREFLIGHT PASS, existing synthetic source SQL integration **4/4 PASS**.\n'
          start+='- Deterministic source SQL interleaving **D4_SAFETY_FAIL**: flight certification overwritten, FSTD certification overwritten and independent audit row deleted on synthetic rows; this is not a real 2-session Next.js app/HTTP exploit.\n'
          start+='- Local owned cluster stop/disposal **PASS as reported by user-run tool**; independent cloud OS inspection NOT RUN.\n'
          start+='- Full app signed-v13 GET/restore, two real concurrent sessions, full release candidate CI, product D4 fix **NOT RUN / NOT IMPLEMENTED**. D2 gzip caps unfrozen. Production DB/schema/flags UNKNOWN.\n'
          start+='- DeepSeek new independent design review **NOT RUN** until an actual reviewer response is received. Prior DeepSeek review had different frozen source and did not execute tests.\n\n'
          start+='## Integrity and confidentiality\n\n'
          start+='- **01_SOURCE_MANIFEST.json** lists each included file path/byte-length/SHA256 and a precise source commit. Raw source files are unchanged; canonical long-doc excerpts are explicitly marked and show the complete original file hash.\n'
          start+='- Packet generator validates Git checkout SHA and the six-file docs-only design diff. This does not independently re-check GitHub signatures or deployment state.\n'
          start+='- Private repository source: share only with a reviewer you deliberately trust. Do not upload real backups, private flights, GPS, API keys or passwords.\n'
          start+='- Reviewer MUST NOT execute SQL/code, mutate branches, run migrations, merge/deploy, or claim production data was affected.\n\n'
          start+='## Repo state\n\n- PR #446: https://github.com/filipto861/flytally-logbook/pull/446\n- PR #447: https://github.com/filipto861/flytally-logbook/pull/447\n- Source and design docs not merged to main; Vercel production on older commit.\n'
          write('00_START_HERE.md',start)
          # Physical final archive manifest verification (all enumerated entries).
          for e in manifest:
              b=(OUT/e['archive_path']).read_bytes()
              assert len(b)==e['bytes'] and sha(b)==e['sha256'],e['archive_path']
          assert len(volumes)>5 and len(volumes)<20,'Unexpected number of reviewer volumes'
          assert len(manifest)==sum(len(g) for g in GROUPS.values())+len(REVIEW_DOCS)+len(EXCERPTS)
          print('PACKET_VERIFIED source_files=',sum(len(g) for g in GROUPS.values()),'review_docs=',len(REVIEW_DOCS),
                'excerpts=',len(EXCERPTS),'volumes=',len(volumes),'manifest_entries=',len(manifest))
          print('FREEZE source=',SOURCE_SHA,'review=',REVIEW_SHA,'canonical_main=',MAIN_SHA)
          print('VOLUME_LIST')
          for v in volumes:print(v)
          
          PY
      - name: Upload PRIVATE allowlisted DeepSeek review packet
        uses: actions/upload-artifact@v4
        with:
          name: FlyTally_DATA1E3_D4_DeepSeek_Frozen_Review
          path: packet/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
