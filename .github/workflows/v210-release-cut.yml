name: v2.1 release cut updater

on:
  push:
    branches:
      - codex/v210-dashboard-statistics-consolidation
    paths:
      - .github/workflows/v210-release-cut.yml

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v210-dashboard-statistics-consolidation
          fetch-depth: 0
      - name: Cut v2.1.0 release metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path=Path('package.json')
          package=json.loads(package_path.read_text())
          assert package['version']=='2.0.0', package['version']
          package['version']='2.1.0'
          package_path.write_text(json.dumps(package,indent=2)+'\n')

          lock_path=Path('package-lock.json')
          lock=lock_path.read_text()
          needle='"version": "2.0.0"'
          assert lock.count(needle)>=2, lock.count(needle)
          lock=lock.replace(needle,'"version": "2.1.0"',2)
          lock_path.write_text(lock)

          changelog_path=Path('CHANGELOG.md')
          changelog=changelog_path.read_text()
          marker='This file records production-facing behavior changes. Detailed regulatory rationale, migration evidence and UX audits remain in the version-specific review documents.\n\n'
          assert marker in changelog
          assert '## 2.1.0 — Dashboard & Statistics consolidation' not in changelog
          release='\n'.join([
            '## 2.1.0 — Dashboard & Statistics consolidation — 2026-09-07',
            '',
            '### Changed',
            '- Dashboard is a stable all-time at-a-glance home without historical period controls; period analysis lives in Statistics.',
            '- Historical Dashboard period URLs hand off to the equivalent Statistics scope instead of silently losing the selected period.',
            '- Career snapshot is a dedicated Statistics workspace and no longer lengthens Overview; its all-time nature is explicit and its period selector is hidden.',
            '- Existing Dashboard saved-layout migration/customization remains intact and analytical widgets cannot be re-added to Dashboard.',
            '',
            '### Preserved',
            '- v2.0 category-aware logged-time, certification, sharing, print/export and Dashboard Safety Pilot semantics are unchanged.',
            '- No database schema, regulatory calculation or credential workflow changed in this release.',
            '',
          ])+'\n'
          changelog_path.write_text(changelog.replace(marker,marker+release,1))

          roadmap_path=Path('ROADMAP.md')
          roadmap=roadmap_path.read_text()
          start=roadmap.index('## Current release — v2.0.0 — Multi-category Pilot Logbook')
          end=roadmap.index('\n## v1.62.0',start)
          old=roadmap[start:end]
          historical=old.replace('## Current release — v2.0.0 — Multi-category Pilot Logbook','## v2.0.0 — Multi-category Pilot Logbook',1)
          current='\n'.join([
            '## Current release — v2.1.0 — Dashboard & Statistics consolidation',
            '',
            '- Keep Dashboard as a concise, stable all-time snapshot for total flying, category totals, last flight, recency and quick actions.',
            '- Keep historical period selection and analytical trends exclusively in Statistics while redirecting legacy Dashboard period URLs safely.',
            '- Give Career its own Statistics workspace and make its all-time scope explicit rather than embedding it in Overview.',
            '- Preserve saved Dashboard layouts through the v1.70 compatibility projection and keep analytical widgets out of normal Dashboard customization.',
            '- Preserve all v2.0 category-aware time, certification, sharing, print/export and data-integrity semantics without a schema change.',
            '',
          ])
          roadmap_path.write_text(roadmap[:start]+current+historical+roadmap[end:])

          test_path=Path('tests/v200-release-metadata.test.ts')
          test=test_path.read_text()
          test=test.replace('assert.equal(pkg.version,"2.0.0");\n  assert.equal(lock.version,"2.0.0");\n  assert.equal(lock.packages[""].version,"2.0.0");','const [major]=String(pkg.version).split(".").map(Number);\n  assert.ok(major>=2);\n  assert.equal(lock.version,pkg.version);\n  assert.equal(lock.packages[""].version,pkg.version);')
          test=test.replace('assert.match(read("ROADMAP.md"),/## Current release — v2\\.0\\.0 — Multi-category Pilot Logbook/);','assert.match(read("ROADMAP.md"),/## v2\\.0\\.0 — Multi-category Pilot Logbook/);')
          test_path.write_text(test)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md ROADMAP.md tests/v200-release-metadata.test.ts
          git rm .github/workflows/v210-release-cut.yml
          git commit -m "v2.1.0 release cut"
          git push origin HEAD:codex/v210-dashboard-statistics-consolidation
