name: v2.2 release cut updater
on:
  push:
    branches:
      - codex/v220-action-center
permissions:
  contents: write
jobs:
  release-cut:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v220-action-center
          fetch-depth: 0
      - name: Apply v2.2.0 release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pkg=Path('package.json')
          text=pkg.read_text()
          old='"version": "2.1.0"'
          assert text.count(old)>=1
          pkg.write_text(text.replace(old,'"version": "2.2.0"',1))

          lock=Path('package-lock.json')
          text=lock.read_text()
          assert text.count(old)>=2
          lock.write_text(text.replace(old,'"version": "2.2.0"',2))

          changelog=Path('CHANGELOG.md')
          text=changelog.read_text()
          anchor='## 2.1.0 — Dashboard & Statistics consolidation — 2026-09-07'
          assert anchor in text
          section='''## 2.2.0 — Action Center & Shared Flight Workflow — 2026-09-07

### Added
- Added an authoritative Action Center for unresolved flight invitations, instructor verification requests, aircraft-training signatures and incoming pilot connection requests.
- Sidebar and Dashboard now surface Actions only while a real workflow decision is pending; the badge is derived from workflow state rather than unread notification state.

### Changed
- Notifications remain the update/history inbox and no longer act as the global pending-work signal.
- Needs attention remains separate and continues to contain only actionable data-quality findings from the pilot's own logbook.
- Shared-flight and signature requests reuse the existing Review & add, Review & sign and Decline workflows; inline Action Center decisions disappear immediately after completion.

### Integrity
- Pending shared-flight actions require the exact current certified source revision and hash, so stale requests do not create ghost actions.
- Legacy instructor approvals are de-duplicated when the canonical instructor participation exists, while that participation still counts once as the real action.
- Modern `signature_request` notifications now support the same direct Decline path as other shared-flight requests.
- No database schema, certification fingerprint, verification payload, sharing ownership or audit-trail semantics changed.

'''
          changelog.write_text(text.replace(anchor,section+anchor,1))

          roadmap=Path('ROADMAP.md')
          text=roadmap.read_text()
          old_header='## Current release — v2.1.0 — Dashboard & Statistics consolidation'
          assert old_header in text
          current='''## Current release — v2.2.0 — Action Center & Shared Flight Workflow

- Keep unresolved workflow decisions in one authoritative Actions inbox sourced from the underlying workflow tables rather than notification read state.
- Show Actions in global navigation and Dashboard only while a genuine pending decision exists, while keeping Notifications as update/history and Needs attention as data-quality work.
- Require shared-flight actions to match the current certified source revision/hash and de-duplicate legacy instructor approvals behind canonical participations.
- Reuse the established Review & add, Review & sign, Accept and Decline workflows so certification fingerprints, verification payloads, sharing ownership and audit trails stay authoritative.
- Preserve v2.1 Dashboard/Statistics information architecture and all v2.0 multi-category semantics without a schema change.

## v2.1.0 — Dashboard & Statistics consolidation'''
          roadmap.write_text(text.replace(old_header,current,1))

          Path('tests/v210-release-metadata.test.ts').write_text('''import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import test from "node:test";

          const root=path.resolve(import.meta.dirname,"..");
          const read=(file:string)=>fs.readFileSync(path.join(root,file),"utf8");

          test("v2.1 release remains a preserved baseline for later v2.x releases",()=>{
            const pkg=JSON.parse(read("package.json")),lock=JSON.parse(read("package-lock.json"));
            const [major,minor]=String(pkg.version).split(".").map(Number);
            assert.ok(major>2||(major===2&&minor>=1));
            assert.equal(lock.version,pkg.version);
            assert.equal(lock.packages[""].version,pkg.version);
            assert.match(read("CHANGELOG.md"),/## 2\\.1\\.0 — Dashboard & Statistics consolidation/);
            assert.match(read("ROADMAP.md"),/## v2\\.1\\.0 — Dashboard & Statistics consolidation/);
          });
          '''.replace('          ',''))
          PY
          git rm .github/workflows/v220-release-cut.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md ROADMAP.md tests/v210-release-metadata.test.ts
          git commit -m "v2.2.0 release cut"
          git push origin HEAD:codex/v220-action-center
