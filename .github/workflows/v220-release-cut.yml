name: v2.2 release cut updater
on:
  push:
    branches:
      - codex/v220-action-center
permissions:
  contents: write
jobs:
  release-cut:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v220-action-center
          fetch-depth: 0
      - name: Apply v2.2.0 release metadata
        shell: bash
        run: |
          npm version 2.2.0 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path
          from base64 import b64decode

          changelog=Path('CHANGELOG.md')
          text=changelog.read_text()
          anchor='## 2.1.0 — Dashboard & Statistics consolidation — 2026-09-07'
          assert anchor in text
          section=b64decode('').decode()
          changelog.write_text(text.replace(anchor,section+anchor,1))

          roadmap=Path('ROADMAP.md')
          text=roadmap.read_text()
          old='## Current release — v2.1.0 — Dashboard & Statistics consolidation'
          assert old in text
          current=b64decode('').decode()
          roadmap.write_text(text.replace(old,current,1))

          Path('tests/v210-release-metadata.test.ts').write_bytes(b64decode(''))
          Path('tests/v220-release-metadata.test.ts').write_bytes(b64decode(''))
          PY
          git rm .github/workflows/v220-release-cut.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md ROADMAP.md tests/v210-release-metadata.test.ts tests/v220-release-metadata.test.ts
          git commit -m "v2.2.0 release cut"
          git push origin HEAD:codex/v220-action-center
