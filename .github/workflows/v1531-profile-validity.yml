name: v1.53.1 aircraft profile validity patch

on:
  push:
    branches:
      - codex/v1531-aircraft-state

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'v1.53.1 align aircraft profile validity') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1531-aircraft-state
          persist-credentials: true
      - name: Align EASA aircraft profile validity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          quick=Path('components/quick-aircraft-form.tsx')
          text=quick.read_text()
          text=text.replace(
            '<div className="quick-aircraft-intro wide"><strong>Only the basics are needed.</strong><span>You can add technical details, pricing and defaults later.</span></div>',
            '<div className="quick-aircraft-intro wide"><strong>Start with the aircraft identity.</strong><span>ULL needs registration and type. EASA also needs the manufacturer and class; pricing and technical defaults stay optional.</span></div>'
          )
          anchor='''    <label>Registration<input name="registration" placeholder="OK-ABC" autoCapitalize="characters" required autoFocus/><small>The registration shown in your logbook.</small></label>\n    <label>Aircraft type / model<input name="aircraft_model" placeholder="Bristell B23" required/><small>A simple name is enough to get started.</small></label>'''
          replacement='''    <label>Registration<input name="registration" placeholder="OK-ABC" autoCapitalize="characters" required autoFocus/><small>The registration shown in your logbook.</small></label>\n    <label>Make<input name="aircraft_make" placeholder="BRM Aero" required={logbook==="EASA"}/><small>{logbook==="EASA"?"Required for the EASA aircraft identity.":"Manufacturer, when known."}</small></label>\n    <label>Aircraft type / model<input name="aircraft_model" placeholder="Bristell B23" required/><small>A simple name is enough to get started.</small></label>'''
          if anchor not in text: raise SystemExit('quick aircraft main anchor missing')
          text=text.replace(anchor,replacement,1)
          advanced='''      <label>Make<input name="aircraft_make" placeholder="BRM Aero"/></label>\n'''
          if advanced not in text: raise SystemExit('quick aircraft advanced make missing')
          text=text.replace(advanced,'',1)
          quick.write_text(text)

          manager=Path('components/aircraft-manager.tsx')
          text=manager.read_text()
          old='''    <label>Make<input name="aircraft_make" defaultValue={t(aircraft?.aircraft_make)} placeholder="Tecnam"/><small>Manufacturer, when known.</small></label>'''
          new='''    <label>Make<input name="aircraft_make" defaultValue={t(aircraft?.aircraft_make)} placeholder="Tecnam" required={logbook==="EASA"}/><small>{logbook==="EASA"?"Required for the EASA aircraft identity.":"Manufacturer, when known."}</small></label>'''
          if old not in text: raise SystemExit('aircraft manager make anchor missing')
          manager.write_text(text.replace(old,new,1))

          actions=Path('app/(protected)/database/actions.ts')
          text=actions.read_text()
          old='''  const make=s(form,"aircraft_make"),model=s(form,"aircraft_model"),variant=s(form,"aircraft_variant"),displayType=s(form,"aircraft_type")||[model,variant].filter(Boolean).join(" ");\n  const creditRaw='''
          new='''  const make=s(form,"aircraft_make"),model=s(form,"aircraft_model"),variant=s(form,"aircraft_variant"),displayType=s(form,"aircraft_type")||[model,variant].filter(Boolean).join(" "),evidence=s(form,"evidence").toUpperCase(),requestedClass=s(form,"aircraft_class").toUpperCase();\n  if(!["ULL","EASA"].includes(evidence))return{ok:false,message:"Select a valid normal logbook."};\n  const easaClasses=["SEP","TMG","MEP","SET","OTHER","GLIDER"],aircraftClass=evidence==="ULL"?"ULL":requestedClass;\n  if(evidence==="EASA"&&(!make||!model))return{ok:false,message:"An EASA aircraft profile requires both manufacturer (Make) and aircraft type/model."};\n  if(evidence==="EASA"&&!easaClasses.includes(aircraftClass))return{ok:false,message:"Select a valid EASA aircraft class."};\n  const creditRaw='''
          if old not in text: raise SystemExit('aircraft action validation anchor missing')
          text=text.replace(old,new,1)
          text=text.replace('aircraft_class=${s(form,"aircraft_class")},evidence=${s(form,"evidence")}', 'aircraft_class=${aircraftClass},evidence=${evidence}')
          text=text.replace('${s(form,"aircraft_class")},${s(form,"evidence")}', '${aircraftClass},${evidence}')
          actions.write_text(text)

          test=Path('tests/v1531-aircraft-state.test.ts')
          text=test.read_text()
          addition='''\n\ntest("v1.53.1 keeps required EASA aircraft identity out of the optional settings drawer",()=>{\n  const quick=read("components/quick-aircraft-form.tsx"),manager=read("components/aircraft-manager.tsx"),actions=read("app/(protected)/database/actions.ts");\n  const quickDrawer=quick.indexOf('<details className="quick-aircraft-advanced');\n  const quickMake=quick.indexOf('name="aircraft_make"');\n  assert.ok(quickMake>=0&&quickDrawer>quickMake);\n  assert.match(quick,/name="aircraft_make"[^\\n]*required=\\{logbook==="EASA"\\}/);\n  assert.match(manager,/name="aircraft_make"[^\\n]*required=\\{logbook==="EASA"\\}/);\n  assert.match(actions,/evidence==="EASA"&&\\(!make\\|\\|!model\\)/);\n  assert.match(actions,/evidence==="ULL"\\?"ULL":requestedClass/);\n});\n'''
          if 'keeps required EASA aircraft identity out of the optional settings drawer' not in text:
              test.write_text(text+addition)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/quick-aircraft-form.tsx components/aircraft-manager.tsx app/'(protected)'/database/actions.ts tests/v1531-aircraft-state.test.ts
          git commit -m "v1.53.1 align aircraft profile validity"
          git push origin HEAD:codex/v1531-aircraft-state
