name: Validate FlyTally v1.51.3 staging

on:
  push:
    branches:
      - codex/v1513-lapl-audit-alignment

permissions:
  contents: write

concurrency:
  group: v1513-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/v1513_finalize.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        run: npm run test:postgres
      - run: npx next build
      - name: Commit finalized v1.51.3 tree when needed
        run: |
          if git diff --quiet; then
            echo "Release tree already finalized."
            exit 0
          fi
          git config user.name "filipto861"
          git config user.email "120219642+filipto861@users.noreply.github.com"
          git add package.json lib/recency-engine.ts lib/recency-audit.ts lib/recency-audit-service.ts components/aircraft-manager.tsx tests/v151-regulatory-correctness.test.ts
          git commit -m "v1.51.3 automatic ULL recency credit [finalized]"
          git push origin HEAD:codex/v1513-lapl-audit-alignment
