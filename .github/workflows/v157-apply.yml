          old='<label>Departure<input name="departure" value={departure} onChange={e=>setDeparture(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters"/></label>\n      <label>Arrival<input name="arrival" value={arrival} onChange={e=>setArrival(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters"/></label>'
          new=old+'\n      {!editing&&(departure||recentRoutes.length)?<div className="route-shortcuts wide" aria-label="Route shortcuts"><span>Quick route</span><div className="route-shortcuts-list">{departure?<button type="button" onClick={()=>applyRoute(departure,departure)} disabled={Boolean(arrival)&&arrival===departure}>Local · {departure} → {departure}</button>:null}{recentRoutes.slice(0,4).map(route=><button type="button" key={`${route.departure}-${route.arrival}`} onClick={()=>applyRoute(route.departure,route.arrival)}>{route.departure} → {route.arrival}</button>)}</div></div>:null}'
          replace('components/flight-form.tsx',old,new)

