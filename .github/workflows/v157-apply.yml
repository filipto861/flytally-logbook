name: Apply FlyTally v1.57 workflow

on:
  push:
    branches:
      - codex/v1570-flight-entry-workflow
    paths:
      - .github/workflows/v157-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1570-flight-entry-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.57 source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              found=text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {found}: {old[:120]!r}")
              p.write_text(text.replace(old,new,count))

          # Version metadata.
          replace('package.json','"version": "1.56.0"','"version": "1.57.0"')
          replace('package-lock.json','"version": "1.56.0"','"version": "1.57.0"',2)

          # Load v1.57 as the final product UX layer.
          replace('app/layout.tsx','import "./v156-mobile-hardening.css";','import "./v156-mobile-hardening.css";\nimport "./v157-flight-entry-workflow.css";')

          # New-flight page: reuse existing recent-route query for quick entry.
          replace('app/(protected)/flights/new/page.tsx','import { getManualEntryDefaults } from "@/lib/data/flights";','import { getManualEntryDefaults,getRecentRoutes } from "@/lib/data/flights";')
          replace('app/(protected)/flights/new/page.tsx','const [aircraft,defaults,instructorRows]=await Promise.all([','const [aircraft,defaults,instructorRows,recentRoutes]=await Promise.all([')
          replace('app/(protected)/flights/new/page.tsx','sql`SELECT DISTINCT u.display_name FROM pilot_connections c JOIN users u ON u.id=CASE WHEN c.requester_user_id=${userId} THEN c.recipient_user_id ELSE c.requester_user_id END WHERE c.status=\'accepted\' AND ((c.requester_user_id=${userId} AND c.requester_label=\'instructor\') OR (c.recipient_user_id=${userId} AND c.recipient_label=\'instructor\')) ORDER BY u.display_name` as Promise<Array<Record<string,unknown>>>,\n  ]);','sql`SELECT DISTINCT u.display_name FROM pilot_connections c JOIN users u ON u.id=CASE WHEN c.requester_user_id=${userId} THEN c.recipient_user_id ELSE c.requester_user_id END WHERE c.status=\'accepted\' AND ((c.requester_user_id=${userId} AND c.requester_label=\'instructor\') OR (c.recipient_user_id=${userId} AND c.recipient_label=\'instructor\')) ORDER BY u.display_name` as Promise<Array<Record<string,unknown>>>,\n    getRecentRoutes(userId),\n  ]);')
          replace('app/(protected)/flights/new/page.tsx','manual={<FlightForm action={createFlight} aircraft={aircraft} initial={defaults} instructors={instructors}/>}','manual={<FlightForm action={createFlight} aircraft={aircraft} initial={defaults} instructors={instructors} recentRoutes={recentRoutes}/>}')

