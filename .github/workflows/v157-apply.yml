name: Apply FlyTally v1.57 workflow

on:
  push:
    branches:
      - codex/v1570-flight-entry-workflow
    paths:
      - .github/workflows/v157-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1570-flight-entry-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.57 source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path,old,new,count=1):
              p=Path(path); text=p.read_text(); found=text.count(old)
              if found < count: raise SystemExit(f"{path}: expected {count}, found {found}: {old[:100]!r}")
              p.write_text(text.replace(old,new,count))
          rep('package.json','"version": "1.56.0"','"version": "1.57.0"')
          rep('package-lock.json','"version": "1.56.0"','"version": "1.57.0"',2)
          rep('app/layout.tsx','import "./v156-mobile-hardening.css";','import "./v156-mobile-hardening.css";\nimport "./v157-flight-entry-workflow.css";')
          rep('app/(protected)/flights/new/page.tsx','import { getManualEntryDefaults } from "@/lib/data/flights";','import { getManualEntryDefaults,getRecentRoutes } from "@/lib/data/flights";')
          rep('app/(protected)/flights/new/page.tsx','const [aircraft,defaults,instructorRows]=await Promise.all([','const [aircraft,defaults,instructorRows,recentRoutes]=await Promise.all([')
          rep('app/(protected)/flights/new/page.tsx',"sql`SELECT DISTINCT u.display_name FROM pilot_connections c JOIN users u ON u.id=CASE WHEN c.requester_user_id=${userId} THEN c.recipient_user_id ELSE c.requester_user_id END WHERE c.status='accepted' AND ((c.requester_user_id=${userId} AND c.requester_label='instructor') OR (c.recipient_user_id=${userId} AND c.recipient_label='instructor')) ORDER BY u.display_name` as Promise<Array<Record<string,unknown>>>,\n  ]);","sql`SELECT DISTINCT u.display_name FROM pilot_connections c JOIN users u ON u.id=CASE WHEN c.requester_user_id=${userId} THEN c.recipient_user_id ELSE c.requester_user_id END WHERE c.status='accepted' AND ((c.requester_user_id=${userId} AND c.requester_label='instructor') OR (c.recipient_user_id=${userId} AND c.recipient_label='instructor')) ORDER BY u.display_name` as Promise<Array<Record<string,unknown>>>,\n    getRecentRoutes(userId),\n  ]);")
          rep('app/(protected)/flights/new/page.tsx','manual={<FlightForm action={createFlight} aircraft={aircraft} initial={defaults} instructors={instructors}/>}','manual={<FlightForm action={createFlight} aircraft={aircraft} initial={defaults} instructors={instructors} recentRoutes={recentRoutes}/>}')
          rep('components/flight-form.tsx','type Initial=Partial<FlightRow>&Record<string,unknown>;','type Initial=Partial<FlightRow>&Record<string,unknown>;\ntype RecentRoute={departure:string;arrival:string};')
          rep('components/flight-form.tsx','export function FlightForm({action,aircraft,initial={},instructors=[]}:{action:Action;aircraft:AircraftOption[];initial?:Initial;instructors?:Array<{name:string}>}){','export function FlightForm({action,aircraft,initial={},instructors=[],recentRoutes=[]}:{action:Action;aircraft:AircraftOption[];initial?:Initial;instructors?:Array<{name:string}>;recentRoutes?:RecentRoute[]}){')
          old='const blockMinutes=minutesBetween(off,on),airMinutes=minutesBetween(takeoff,landing),billableMinutes=billing==="AIR"?airMinutes:billing==="BLOCK"?blockMinutes:0,billingValue=billing?serializeBilling(billing,billingShare):"",flightPrice=calculatedFlightPrice(hourlyRate,blockMinutes,airMinutes,billingValue),trainingRole=["DUAL","SPIC","PICUS","INSTRUCTOR","EXAMINER"].includes(role),pilotSectionOpen=trainingRole||role==="SAFETY PILOT",countersignatureRequired=["SPIC","PICUS"].includes(role);'
          rep('components/flight-form.tsx',old,old+'\n  const logbookSectionOpen=evidence==="EASA"||!evidence||!aircraftClass||countersignatureRequired,costSectionOpen=!billing;')
          old='const changeDayLandings=(value:number)=>{setLandingsDay(value);if(!movementCustom){setTakeoffsDay(value);setApproachesDay(value)}},changeNightLandings=(value:number)=>{setLandingsNight(value);if(!movementCustom){setTakeoffsNight(value);setApproachesNight(value)}};'
          rep('components/flight-form.tsx',old,old+'\n  const applyRoute=(from:string,to:string)=>{markDirty();setDeparture(from.toUpperCase());setArrival(to.toUpperCase())};')
          rep('components/flight-form.tsx','const missing=[!date&&"date",!registration&&"aircraft",!role&&"role",!evidence&&"logbook",!aircraftClass&&"class",!billing&&"billing"].filter(Boolean);useEffect(()=>{if(state.error){markDirty();errorRef.current?.focus()}},[state.error,markDirty]);','const missing=[!date&&"date",!registration&&"aircraft",!role&&"role",!evidence&&"logbook",!aircraftClass&&"class",!billing&&"billing"].filter(Boolean) as string[],missingLabel={date:"Date",aircraft:"Aircraft",role:"Role",logbook:"Logbook",class:"Aircraft class",billing:"Billing"} as Record<string,string>;useEffect(()=>{if(state.error){markDirty();errorRef.current?.focus()}},[state.error,markDirty]);')
          rep('components/flight-form.tsx','<nav className="entry-progress" aria-label="Manual flight entry progress"><span className="complete">1 <b>Source</b></span><span className="active">2 <b>Details</b></span><span>3 <b>Review &amp; save</b></span></nav>','<nav className="entry-progress" aria-label="Manual flight entry progress"><span className="complete">✓ <b>Source selected</b></span><span className="active">2 <b>Flight details</b></span><span>3 <b>Review below</b></span></nav>')
          old='<label>Departure<input name="departure" value={departure} onChange={e=>setDeparture(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters"/></label>\n      <label>Arrival<input name="arrival" value={arrival} onChange={e=>setArrival(e.target.value.toUpperCase())} placeholder="LKLT" autoCapitalize="characters"/></label>'
          rep('components/flight-form.tsx',old,old+'\n      {!editing&&(departure||recentRoutes.length)?<div className="route-shortcuts wide" aria-label="Route shortcuts"><span>Quick route</span><div className="route-shortcuts-list">{departure?<button type="button" onClick={()=>applyRoute(departure,departure)} disabled={Boolean(arrival)&&arrival===departure}>Local · {departure} → {departure}</button>:null}{recentRoutes.slice(0,4).map(route=><button type="button" key={`${route.departure}-${route.arrival}`} onClick={()=>applyRoute(route.departure,route.arrival)}>{route.departure} → {route.arrival}</button>)}</div></div>:null}')
          old='<label>Takeoff <span className="field-hint">UTC</span><input name="takeoff" type="time" value={takeoff} onChange={e=>setTakeoff(e.target.value)}/></label>\n      <label>Landing <span className="field-hint">UTC</span><input name="landing" type="time" value={landing} onChange={e=>setLanding(e.target.value)}/></label>'
          rep('components/flight-form.tsx',old,old+'\n      <div className="flight-time-summary" aria-live="polite"><div><span>BLOCK</span><strong>{durationLabel(blockMinutes)}</strong></div><div><span>AIR</span><strong>{durationLabel(airMinutes)}</strong></div><small>{blockMinutes||airMinutes?"Calculated automatically from the timeline above.":"Enter the timeline above; FlyTally calculates BLOCK and AIR automatically."}</small></div>')
          rep('components/flight-form.tsx','<details className="entry-section" open={evidence==="EASA"}><summary><span>Logbook details</span>','<details className="entry-section" open={logbookSectionOpen}><summary><span>Logbook details</span>')
          rep('components/flight-form.tsx','<details className="entry-section"><summary><span>Cost &amp; notes</span>','<details className="entry-section" open={costSectionOpen}><summary><span>Cost &amp; notes</span>')
          rep('components/flight-form.tsx','</span></header><dl><div><dt>Date / aircraft</dt>','</span></header>{missing.length?<p className="review-missing-list">Complete before save: {missing.map(item=>missingLabel[item]||item).join(" · ")}</p>:null}<dl><div><dt>Date / aircraft</dt>')
          Path('app/v157-flight-entry-workflow.css').write_text('/* FlyTally v1.57 — flight entry workflow simplification. */\n.route-shortcuts{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-muted,var(--panel2))}.route-shortcuts>span{flex:0 0 auto;color:var(--muted);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.route-shortcuts-list{display:flex;flex-wrap:wrap;gap:7px;min-width:0}.route-shortcuts button{min-height:34px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:.72rem;font-weight:750;cursor:pointer}.route-shortcuts button:hover,.route-shortcuts button:focus-visible{border-color:var(--accent2);color:var(--accent2)}.route-shortcuts button:disabled{opacity:.45;cursor:default}\n.flight-time-summary{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--surface-muted,var(--panel2)) 70%,transparent)}.flight-time-summary>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.flight-time-summary span{color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.08em}.flight-time-summary strong{font-size:1rem}.flight-time-summary small{grid-column:1/-1;color:var(--muted);font-size:.68rem;line-height:1.35}\n.review-missing-list{margin:0 0 12px;padding:9px 11px;border:1px solid color-mix(in srgb,#f59e0b 45%,var(--line));border-radius:9px;background:color-mix(in srgb,#f59e0b 8%,transparent);color:var(--text);font-size:.75rem;font-weight:700}\n@media(max-width:700px){.entry-choice{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.entry-choice button{grid-template-columns:1fr;justify-items:center;padding:11px 10px;text-align:center}.entry-choice button>span,.entry-choice button small{display:none}.entry-choice button strong{font-size:.82rem}.route-shortcuts{display:grid;gap:7px}.route-shortcuts-list{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.route-shortcuts-list::-webkit-scrollbar{display:none}.route-shortcuts button{flex:0 0 auto;min-height:40px}.flight-time-summary{padding:10px}.flight-time-summary small{font-size:.66rem}}\n')
          p=Path('ROADMAP.md'); text=p.read_text(); anchor='## v1.56.0 — Mobile Layout Audit & Responsive Hardening\n'; section='## v1.57.0 — Flight Entry Workflow Simplification\n\n- Reuse recent route history and provide an explicit local-flight route shortcut.\n- Show BLOCK/AIR feedback while entering the timeline instead of only at final review.\n- Never leave a missing required choice hidden inside a collapsed Logbook or Cost section.\n- Make final review name the exact missing fields and keep the mobile source selector compact.\n- Preserve v1.51 regulatory semantics, v1.53.1 aircraft-state integrity and v1.56 responsive containment.\n\n'
          if anchor not in text: raise SystemExit('ROADMAP v1.56 anchor missing')
          p.write_text(text.replace(anchor,section+anchor,1))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        run: npm run test:postgres
      - run: npm run build
      - name: Commit validated source changes and remove temporary workflow
        shell: bash
        run: |
          rm -f flytally-postgres-acceptance.txt flytally-scale-evidence.json
          rm -f .github/workflows/v157-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/layout.tsx app/v157-flight-entry-workflow.css 'app/(protected)/flights/new/page.tsx' components/flight-form.tsx ROADMAP.md .github/workflows/v157-apply.yml
          git commit -m "v1.57.0 flight entry workflow simplification"
          git push origin HEAD:codex/v1570-flight-entry-workflow
