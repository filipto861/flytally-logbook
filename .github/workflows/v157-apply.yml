          # Detailed UX audit / release record.
          Path('FLIGHT_ENTRY_UX_V157.md').write_text('''# FlyTally v1.57.0 — Flight Entry Workflow Simplification

## Objective

Make normal flight entry understandable without requiring the pilot to know FlyTally's internal data model. The release is intentionally workflow-focused: fewer repeated inputs, earlier feedback and no required choice hidden inside a collapsed section.

## UX audit findings

1. **Route repetition:** consecutive and frequently flown routes still required retyping both airports even though FlyTally already stores recent-route statistics.
2. **Local flights:** a departure-equals-arrival flight required entering the same airport twice.
3. **Duration feedback:** BLOCK and AIR were calculated only in the lower review/cost area, so a timing mistake was easy to miss while entering the timeline.
4. **Progressive disclosure edge case:** Logbook or Cost sections could be collapsed while containing a required choice. Native validation then had to explain a field the user could not immediately see.
5. **Review feedback:** the review badge reported only a count of missing fields rather than naming them.
6. **Mobile source choice:** Manual/GPS source cards were vertically expensive before the user reached the form.

## Changes

- Reuse the existing `getRecentRoutes()` query in New flight and expose up to four frequent/recent route shortcuts.
- Add an explicit local-flight shortcut that copies the current departure into arrival only when the pilot chooses it.
- Show live BLOCK and AIR durations immediately below the four timeline fields.
- Automatically open Logbook details when EASA, class/logbook completion or countersignature requirements make that section relevant.
- Automatically open Cost & notes when the required billing basis is missing.
- Name missing required fields in Review before save.
- Keep Manual entry / GPS import source selection compact on mobile while preserving both modes.

## Deliberately unchanged

- `parseFlightInput()` and all stored flight field semantics.
- FCL.050/FCL.060, LAPL, FCL.740.A and ULL-credit behavior.
- aircraft registration/profile authority and v1.53.1 stale-state protection.
- certification fingerprints, revisions, signatures and shared-flight ownership.
- GPS evidence/import semantics, print/export and backup/restore.
- existing EASA movement evidence logic and countersignature rules.

## Validation gates

The release must pass TypeScript, the full TypeScript regression suite, PostgreSQL acceptance and a Next.js production build before a production merge. A clean Vercel preview and post-deploy runtime-error check are required after temporary tooling is removed.
''')

          # Durable changelog starts here instead of relying on chat history.
          Path('CHANGELOG.md').write_text('''# FlyTally changelog

This file records production-facing behavior changes. Detailed regulatory and audit rationale remains in the version-specific review documents.

## 1.57.0 — Flight Entry Workflow Simplification — 2026-09-01

### Added
- Recent-route shortcuts in manual New flight using the existing route history query.
- Explicit local-flight shortcut to set arrival equal to the current departure.
- Live BLOCK/AIR duration feedback directly below the timeline.
- Human-readable missing-field list in the final review card.

### Changed
- Logbook and Cost sections open automatically when they contain a required/relevant choice.
- Manual/GPS source selector is more compact on mobile.
- Entry progress wording now reflects that review is inline on the same page.

### Preserved
- No change to flight parsing/storage semantics, regulatory calculations, certification/revisions, aircraft identity authority, GPS evidence, sharing, print/export or backup/restore.

### Verification
- Release gate: TypeScript + complete regression suite + PostgreSQL acceptance + production build + clean Vercel preview + post-deploy runtime audit.
- Detailed record: `FLIGHT_ENTRY_UX_V157.md`.

## 1.56.0 — Mobile Layout Audit & Responsive Hardening
- Added the shared iOS/WebKit native date/time sizing fix and full primary-navigation responsive containment audit.
- Preserved local scrolling for wide tables/navigation rather than hiding page overflow.

## 1.55.0 — Flight Entry Layout & Responsive UX
- Paired Date/Registration, Departure/Arrival, Off-block/On-block, Takeoff/Landing and Role/Day landings into an aligned desktop grid with logical single-column mobile flow.

## 1.54.4 — Aircraft Picker Selection Close Fix
- Prevented a confirmed aircraft catalogue selection from immediately reopening because of the debounced search effect.

## 1.54.3 — Aircraft Type Catalogue & Smart Aircraft Setup
- Added the structured FAA aircraft type catalogue, searchable Make/Model/ICAO picker and manual fallback while keeping Part-FCL class pilot-confirmed.

## 1.53.1 — Aircraft State Integrity
- Prevented mixed/stale aircraft state when changing registration or aircraft type in flight entry.

## 1.53.0 — Guided Everyday Entry
- Made normal manual entry the default and simplified first-aircraft/profile setup through progressive disclosure.

## 1.52.0 — Codebase Review & Cleanup
- Removed the retired Streamlit/Python runtime and legacy generated artifacts while preserving the validated v1.51 regulatory baseline.

## 1.51.x — Regulatory Correctness Core
- Established the tested FCL.060, LAPL/FCL.740.A, legacy movement, automatic ULL-credit and certification-evidence baseline used by later releases.
''')

