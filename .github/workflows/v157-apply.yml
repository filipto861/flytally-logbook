@media(max-width:700px){.entry-choice{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.entry-choice button{grid-template-columns:1fr;justify-items:center;padding:11px 10px;text-align:center}.entry-choice button>span,.entry-choice button small{display:none}.entry-choice button strong{font-size:.82rem}.route-shortcuts{display:grid;gap:7px}.route-shortcuts-list{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.route-shortcuts-list::-webkit-scrollbar{display:none}.route-shortcuts button{flex:0 0 auto;min-height:40px}.flight-time-summary{padding:10px}.flight-time-summary small{font-size:.66rem}}
