.flight-time-summary{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--surface-muted,var(--panel2)) 70%,transparent)}.flight-time-summary>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.flight-time-summary span{color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.08em}.flight-time-summary strong{font-size:1rem}.flight-time-summary small{grid-column:1/-1;color:var(--muted);font-size:.68rem;line-height:1.35}
