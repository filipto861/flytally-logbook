name: DATA1E3 TEMP D4 A1 CRLF-safe retest on Windows (NO DB)
on:
  push:
    branches:
      - fix/logbook-data1e3-d4-a1-parent-conflict-20261030
    paths:
      - .github/workflows/data1e3-d4-a1-temporary.yml
permissions:
  contents: read
jobs:
  source-and-typecheck:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Exact candidate and dependencies
        shell: pwsh
        run: |
          Write-Host ('A1_TEST_SHA=' + (git rev-parse HEAD))
          Write-Host ('NODE=' + (node --version))
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Targeted D1 D3 D4 regression, no DB
        shell: pwsh
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --experimental-strip-types tests/v381-data1e3-stored-recovery-guards.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'target tests failed' }
      - name: TypeScript compiler
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'typecheck failed' }
      - name: Boundaries
        shell: pwsh
        run: |
          Write-Host 'No PostgreSQL, no SQL, no restore, no migration, no deployment.'
