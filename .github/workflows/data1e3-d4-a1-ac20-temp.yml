name: TEMP D4 A1 AC20 locked registry and no-DB acceptance
on:
  push:
    branches:
      - test/logbook-data1e3-d4-a1-owned-pg16-20261030
    paths:
      - .github/workflows/data1e3-d4-a1-ac20-temp.yml
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No DB syntax and pinned-test SHA
        shell: pwsh
        run: |
          git rev-parse HEAD
          node --version
          node --check tooling/data1e3-d4-a1-owned-local-pg16.mjs
          if ($LASTEXITCODE -ne 0) { throw 'A1 launcher syntax failed' }
          node --check tooling/data1e3-d4-a1-source-sql-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'A1 SQL probe syntax failed' }
          node --test tooling/data1e3-d4-a1-source-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'A1 source contract failed' }
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');const s=fs.readFileSync('tests/integration/postgres-security-restore.test.ts','utf8').replaceAll('\r\n','\n');console.log('A1_AC20_CANONICAL_SHA256='+crypto.createHash('sha256').update(s).digest('hex'))"
          if ($LASTEXITCODE -ne 0) { throw 'hash calculation failed' }
      - name: TypeScript compile only
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          node tooling/validate-postgres-partition-registry.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL locked-registry failed' }
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --experimental-strip-types tests/v381-data1e3-stored-recovery-guards.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'A1 source regression failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'typecheck failed' }
