name: Run FlyTally v1.58 corrected gate

on:
  push:
    branches:
      - codex/v1580-flight-entry-polish
    paths:
      - .github/workflows/v158-run.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flytally
          POSTGRES_PASSWORD: flytally
          POSTGRES_DB: flytally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flytally -d flytally_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://flytally:flytally@127.0.0.1:5432/flytally_test
      AUTH_SECRET: flytally-ci-auth-secret-not-for-production
      SIGNING_SECRET: flytally-ci-signing-secret-with-enough-entropy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1580-flight-entry-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.58 transform and future-proof v1.57 historical contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/v158-apply.yml').read_text()
          marker="python - <<'PY'\n"
          block=workflow.split(marker,1)[1].split("\n          PY",1)[0]
          exec(compile(textwrap.dedent(block),'v158-transform.py','exec'))

          p=Path('tests/v157-flight-entry-workflow.test.ts')
          t=p.read_text()
          t=t.replace('''  assert.equal(pkg.version,"1.57.0");\n  assert.equal(lock.version,pkg.version);\n  assert.equal(lock.packages[""].version,pkg.version);''','''  assert.equal(lock.version,pkg.version);\n  assert.equal(lock.packages[""].version,pkg.version);\n  const [major,minor]=String(pkg.version).split(".").map(Number);\n  assert.ok(major>1||(major===1&&minor>=57));''',1)
          t=t.replace('assert.match(audit,/local-flight shortcut/);','assert.match(audit,/Local · DEP → DEP/);',1)
          p.write_text(t)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL acceptance tests
        env:
          FLYTALLY_POSTGRES_INTEGRATION: "1"
        shell: bash
        run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tee flytally-postgres-acceptance.txt
      - run: npm run build
      - name: Commit clean validated v1.58 release tree
        shell: bash
        run: |
          rm -f flytally-postgres-acceptance.txt flytally-scale-evidence.json tsconfig.tsbuildinfo
          rm -f .github/workflows/v158-apply.yml .github/workflows/v158-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.58.0 flight entry polish and smart defaults"
          git push origin HEAD:codex/v1580-flight-entry-polish
