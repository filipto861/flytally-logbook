name: TEMP DATA1E3 D4 A1 no-DB safety validation rerun
on:
  push:
    branches:
      - test/logbook-data1e3-d4-a1-owned-pg16-20261030
    paths:
      - .github/workflows/data1e3-d4-a1-safety-temp.yml
permissions:
  contents: read
jobs:
  no-db:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and contract
        shell: pwsh
        run: |
          git rev-parse HEAD
          node --check tooling/data1e3-d4-a1-source-sql-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Probe syntax failed' }
          node --check tooling/data1e3-d4-a1-owned-local-pg16.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Wrapper syntax failed' }
          node --test tooling/data1e3-d4-a1-source-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Contract tests failed' }
